# Builds the "Line Study" Android app (APK) from the app/ folder.
# Runs every time something in app/ changes, or by hand from the Actions tab ("Run workflow").
# The finished APK appears under Releases on the repository's main page.
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the files
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"

      - name: Install app packages
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Copy offline files (hand-tracking model, fonts)
        working-directory: app
        run: bash prepare.sh

      - name: Create Android project
        working-directory: app
        run: |
          rm -rf android
          npx cap add android
          bash android-setup.sh "${{ github.run_number }}"

      - name: App icon
        working-directory: app
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor "#0d1214" --iconBackgroundColorDark "#0d1214" --splashBackgroundColor "#0d1214" --splashBackgroundColorDark "#0d1214"

      - name: Copy web files into the app
        working-directory: app
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          mkdir -p ~/.android
          cp ../keystore/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LineStudy-v${{ github.run_number }}.apk"

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v7
        with:
          name: LineStudy-v${{ github.run_number }}
          path: LineStudy-v${{ github.run_number }}.apk

      - name: Publish under Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: Line Study v${{ github.run_number }}
          files: LineStudy-v${{ github.run_number }}.apk
          make_latest: true
          body: |
            Line Study: hand and finger time study for sewing lines. Works offline.
            On the phone: tap the .apk file below to download, open it, and allow "Install unknown apps" for your browser when Android asks.
            Installing a newer version over an older one keeps your lines and studies.
