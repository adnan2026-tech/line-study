<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1214">
<title>Line Study</title>
<link rel="stylesheet" href="fonts/fonts.css" onerror="this.remove()">
<style>

/* Layout: phone-first single column (max 760px). Camera screens put the video stage first; analysis screens lead with a summary, then the ranked improvement list, then replay and detail. Single dark theme by design (shop-floor camera tool). */
/* Layout: phone-first app shell. Sticky top bar (brand + user menu), one content column (max 760px).
   A standard opens with a header and a tab strip (Overview · Video · Job breakdown · Visual instruction).
   Camera and replay surfaces stay dark; everything else is light and high-contrast for factory lighting. */
:root{
  --bg:#edf1ee; --panel:#ffffff; --panel-2:#f2f5f3; --ink:#14221f; --muted:#56655f; --line:#d5ded9;
  --accent:#0d7a71; --accent-dk:#095e57; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --ok:#178a4a; --slow:#b9650a; --method:#a33aa0; --miss:#d1352a; --fast:#2d6cd1; --ghost:#f2f5f4;
  --dark:#0f1716; --dark-ink:#e8eeec;
  --abh:57px;
  --shadow:0 1px 2px rgba(18,40,35,.06),0 6px 18px rgba(18,40,35,.06);
  --f-display:"Barlow Condensed","Noto Sans Bengali","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap>*,.panel>*{min-width:0;max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:40px;height:40px;stroke-width:1.6;color:var(--muted)}

/* top bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar-in{max-width:760px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand .logo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.brand>span:last-child{min-width:0}
.userbar{display:flex;align-items:center;gap:6px;min-width:0;flex:none;max-width:50%}
.brand{min-width:0;flex:1 1 auto}
@media (max-width:440px){.uchip i{display:none}}
.uchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:13px;cursor:pointer;max-width:100%;min-width:0}
.uchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uchip i{font-style:normal;color:var(--muted);font-weight:500}

.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;text-transform:uppercase;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
h2 .of{color:var(--muted);font-weight:600}
h3{font-size:15px;font-weight:600;margin:0}
.lead{color:var(--muted);margin:2px 0 0;max-width:62ch}
.note{font-size:12.5px;color:var(--muted);margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.panel.flush{padding:0;overflow:hidden}
.panel .pad{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.panel.guide{border:2px solid var(--accent)}
.panel.empty{align-items:center;text-align:center;padding:28px 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[disabled],textarea[disabled]{background:var(--panel-2);color:var(--muted)}
textarea{min-height:70px;resize:vertical;line-height:1.4}
.btn{min-height:46px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:active{background:var(--accent-dk)}
.btn.big{min-height:58px;font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.05em;flex:1}
.btn.stop{background:var(--miss);border-color:var(--miss);color:#fff}
.btn.sm{min-height:40px;padding:4px 12px;font-size:13.5px;border-radius:10px}
.btn.sm .ic{width:17px;height:17px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--miss)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0;min-height:38px;text-align:left}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{flex:1;min-height:44px;border:0;background:none;font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 10px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{min-height:38px;font-size:13px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:36px;display:flex;align-items:center}
details.more[open]{display:flex;flex-direction:column;gap:8px}

/* standard header + tabs */
.sthead{display:flex;flex-direction:column;gap:2px}
/* home */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0a3431 0%,#0d7a71 62%,#2b9c8e 100%);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:190px;height:190px;border-radius:50%;border:30px solid rgba(255,255,255,.07);pointer-events:none}
.hero .eyebrow{color:#bfe8e1}.hero h1{color:#fff;font-size:32px}.hero p{margin:4px 0 0;color:#d6efea}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{background:rgba(255,255,255,.13);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.hstats b{font-family:var(--f-display);font-size:28px;line-height:1}.hstats span{font-size:12px;color:#d6efea}
.quick{display:grid;grid-template-columns:1fr;gap:8px}
.qa{display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);text-align:left;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.qa .ic{width:30px;height:30px}.qa.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.qa b{display:block;font-family:var(--f-display);font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.04em}.qa small{display:block;opacity:.82;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{--tc:var(--accent);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;min-height:122px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);min-width:0}
.tile:active,.qa:active{transform:translateY(1px)}
.tile .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,#fff);color:var(--tc)}
.tile b{font-size:15px;line-height:1.2}.tile .note{font-size:12px;margin:0}
.t2{--tc:#c2410c}.t3{--tc:#2d6cd1}.t4{--tc:#a33aa0}.t5{--tc:#178a4a}.t6{--tc:#b9650a}.t7{--tc:#56655f}
.sec-lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px -4px}
@media(min-width:560px){.quick{grid-template-columns:1fr 1fr}}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
/* approval codes */
.code{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.12em;text-align:center;background:var(--panel-2);border:1.5px dashed var(--accent);border-radius:12px;padding:12px;user-select:all;color:var(--accent-dk)}
.codein{font-family:var(--f-mono);font-size:22px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
.wait{display:flex;gap:10px;align-items:flex-start;background:#fff7e6;border:1px solid #f0d49b;border-radius:12px;padding:10px 12px}
/* snap */
.snap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.snap img{width:104px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--dark)}
.tabs{position:sticky;top:calc(var(--abh) + env(safe-area-inset-top,0px));z-index:15;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-height:54px;padding:6px 4px;border-radius:10px;border:0;background:none;font-weight:600;font-size:12px;line-height:1.15;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;text-align:center;min-width:0}
.tabs button.on{background:var(--accent-soft);color:var(--accent-dk)}
.tabs .ic{width:18px;height:18px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.step b{font-family:var(--f-display);font-size:30px;color:var(--accent);line-height:1}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .meta{color:var(--muted);font-size:13px}
.item-main{min-width:0;flex:1}
.chip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.factory,.chip.vid{color:var(--accent);border-color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.kpb{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff;background:var(--c);margin-right:4px;white-space:nowrap}

/* camera + video surfaces (dark) */
.stage{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:60vh;margin:0 auto}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.pill{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
.pill.rec{background:rgba(209,53,42,.9)}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:120px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px;background:rgba(10,16,15,.86)}
.msg .note{color:var(--dark-ink);font-size:14px}
.vstage{position:relative;background:#000;width:100%}
.vstage video{width:100%;max-height:56vh;display:block;object-fit:contain;background:#000}
.player .vstage canvas{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;aspect-ratio:auto;pointer-events:none;background:transparent;border-radius:0}
.pinv{position:sticky;top:calc(var(--abh) + env(safe-area-inset-top,0px));z-index:12}
.pinv .vstage video{max-height:32vh}
.pinv .pctl{padding-bottom:10px}
body.typing .pinv .vstage video{max-height:22vh}
body.typing .pinv .pctl{display:none}
body.typing .pinv .player>canvas{max-height:22vh}
.vcap{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(0,0,0,.66);color:#fff;border-radius:8px;padding:4px 10px;font-weight:600;font-size:14px;pointer-events:none}
.vcap:empty{display:none}
.vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:rgba(10,16,15,.88);color:#fff;font-size:14px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--slow)}
.player>canvas{width:100%;aspect-ratio:4/3;background:var(--dark);border-radius:12px;display:block}
.pinv .player>canvas{max-height:32vh;width:auto;margin:0 auto}
.panel.flush .player>canvas{border-radius:0}
.pctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel.flush .pctl{padding:10px 14px 0}
.pctl input[type=range]{flex:1 1 120px;min-width:0;accent-color:var(--accent);min-height:36px}
.pctl .time{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:11ch;text-align:right}
.tl{position:relative;height:44px;border-radius:10px;background:var(--panel-2);overflow:hidden;cursor:pointer;touch-action:manipulation;border:1px solid var(--line)}
.tl .blk{position:absolute;top:0;bottom:0;border-right:2px solid #fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:#0b1513;font-weight:600;overflow:hidden}
.tl .out{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(20,34,31,.5),rgba(20,34,31,.5) 4px,rgba(20,34,31,.3) 4px,rgba(20,34,31,.3) 8px)}
.tl .ph{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);box-shadow:0 0 0 1px #fff;pointer-events:none}
.tl .mk{position:absolute;top:0;width:2px;height:10px;background:var(--slow)}
.tl-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);font-weight:700}
td.r,th.r{text-align:right}
td.num,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--accent-soft)}
tr.click{cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.imp{display:flex;flex-direction:column;gap:8px}
.imp-item{display:grid;grid-template-columns:5px 1fr auto;gap:4px 12px;padding:10px 12px 10px 0;background:var(--panel-2);border-radius:12px;cursor:pointer;border:0;text-align:left;width:100%}
.imp-item .sev{grid-row:1/3;background:var(--c);border-radius:12px 0 0 12px}
.imp-item .t{font-weight:600}
.imp-item .lost{font-family:var(--f-mono);font-size:13px;color:var(--c);text-align:right;font-weight:600}
.imp-item .d{grid-column:2/4;font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;background:var(--c);display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c),var(--c) 4px,transparent 4px,transparent 7px)}
.cur-el{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.busy{position:fixed;inset:0;background:rgba(10,16,15,.82);color:#fff;display:flex;align-items:center;justify-content:center;z-index:55;font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:20px}
.check{display:flex;gap:10px;align-items:center;min-height:42px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check.sm{min-height:34px;font-size:13px;font-weight:600}
.kchip{min-height:40px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer}
.kchip.on{background:var(--c);border-color:var(--c);color:#fff}
.jstep,.vistep{gap:10px}
.jstep h2,.vistep h2{display:flex;align-items:center;gap:8px}
.sn{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--f-mono);font-size:15px;font-weight:600;flex:none}
.picbox{border-radius:12px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.picbox canvas{display:block;width:100%;height:auto}
.picbox.small{max-width:260px}
.nopic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;color:var(--muted);font-size:13px}
.savestate{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.chapters{display:flex;flex-direction:column;gap:6px}
.chap{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.chap .n{width:28px;height:28px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600}
.chap.on{border-color:var(--accent);background:var(--accent-soft)}
.chap.on .n{background:var(--accent);color:#fff}
.chap .num{font-size:12px;color:var(--muted)}
.menu{position:fixed;inset:0;z-index:40;background:rgba(10,16,15,.45);display:flex;align-items:flex-start;justify-content:flex-end;padding:calc(62px + env(safe-area-inset-top,0px)) 14px 14px}

<header class="appbar"><div class="appbar-in">

<main id="app" class="wrap"></main>
<div class="toast" id="toast" hidden></div>

<script type="module">
// Inside the Android app everything loads from the phone; on the web it loads from the internet.
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NP=NATIVE?(window.Capacitor.Plugins||{}):{};
const CDN=NATIVE?new URL("mediapipe",location.href).href:"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const HMODEL=NATIVE?CDN+"/hand_landmarker.task":"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
let HandLandmarker=null,FilesetResolver=null;
if(!window.__HANDSTUB){try{({HandLandmarker,FilesetResolver}=await import(CDN+"/vision_bundle.mjs"))}catch(e){console.warn("tracking library not loaded",e)}}
/*ENGINE-START*/
/* ===== Hand-motion engine (no DOM) =====
   Frames: [{t, a, b}] where a = operator's right hand and b = left hand, stored as flat [x0,y0,x1,y1,...] of 21 landmarks in thousandths of the image.
   Zones are rectangles in image fractions: {type:"bin"|"needle"|"stack", x, y, w, h}.               */
const MOT={S:{l:"Sew / use",c:"#178a4a",k:"va"},R:{l:"Reach",c:"#5b9be0",k:"nva"},G:{l:"Grasp / pick",c:"#2f6fb8",k:"nva"},M:{l:"Move",c:"#8f78dc",k:"nva"},
  P:{l:"Position / align",c:"#e0a030",k:"nva"},D:{l:"Release / dispose",c:"#c2410c",k:"nva"},H:{l:"Hold",c:"#9aa8a3",k:"nva"},I:{l:"Idle / wait",c:"#d1352a",k:"waste"},U:{l:"Not visible",c:"#dfe5e2",k:"unk"}};
const MORDER="SRGMPDHIU";
const ZT={needle:{l:"Needle / work point",c:"#178a4a"},bin:{l:"Pick-up (bin)",c:"#2d6cd1"},stack:{l:"Finished stack",c:"#c2410c"}};
const TH={still:0.5,fast:3.0,grip:1.5};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hyp=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const median=a=>{if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y);return s[s.length>>1]};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/(a.length-1))};

function handFeat(lm,ar){const p=i=>({x:lm[i*2]/1000*ar,y:lm[i*2+1]/1000});
  const pal=[0,5,9,13,17].map(p);const c={x:pal.reduce((a,q)=>a+q.x,0)/5,y:pal.reduce((a,q)=>a+q.y,0)/5};
  const sz=Math.max(1e-4,hyp(p(0),p(9)));
  return{c,sz,grip:[8,12,16,20].reduce((a,i)=>a+hyp(p(i),c),0)/4/sz,pinch:hyp(p(4),p(8))/sz}}

function zoneAt(zones,c,ar){if(!zones)return null;const x=c.x/ar,y=c.y;let hit=null;
  for(const z of zones){if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h){if(!hit||z.type==="needle")hit=z}}return hit?hit.type:null}

// Per-hand features over the whole recording
function trackFeatures(frames,ar,key,zones){
  const n=frames.length,F=frames.map(f=>f[key]?handFeat(f[key],ar):null);
  // fill short gaps (up to 5 frames) so a hand briefly lost behind fabric does not break motions
  for(let i=0;i<n;i++){if(F[i])continue;let j=i;while(j<n&&!F[j])j++;if(i>0&&j<n&&F[i-1]&&j-i<=5){const A=F[i-1],B=F[j];for(let k=i;k<j;k++){const r=(k-i+1)/(j-i+1);
      F[k]={c:{x:A.c.x+(B.c.x-A.c.x)*r,y:A.c.y+(B.c.y-A.c.y)*r},sz:A.sz,grip:A.grip+(B.grip-A.grip)*r,pinch:A.pinch+(B.pinch-A.pinch)*r,filled:true}}}i=j}
  const sz=median(F.filter(Boolean).map(f=>f.sz))||0.1;
  const T=frames.map(f=>f.t);
  // smooth palm positions over ±80 ms: removes detector jitter before speeds are measured
  const SC=F.map((f,i)=>{if(!f)return null;let x=0,y=0,c=0;for(let k=i;k>=0&&T[i]-T[k]<=80&&F[k];k--){x+=F[k].c.x;y+=F[k].c.y;c++}for(let k=i+1;k<n&&T[k]-T[i]<=80&&F[k];k++){x+=F[k].c.x;y+=F[k].c.y;c++}return{x:x/c,y:y/c}});
  const win=(i,ms,dir)=>{let j=i;while(j+dir>=0&&j+dir<n&&Math.abs(T[j+dir]-T[i])<=ms&&F[j+dir])j+=dir;return j};
  const v=new Array(n).fill(0),str=new Array(n).fill(1),dg=new Array(n).fill(0),zone=new Array(n).fill(null);
  for(let i=0;i<n;i++){if(!F[i])continue;
    const a=win(i,100,-1),b=win(i,100,1);const dt=(T[b]-T[a])/1000;if(dt>0){v[i]=hyp(SC[a],SC[b])/dt/sz;dg[i]=(F[b].grip-F[a].grip)/dt}
    const a2=win(i,220,-1),b2=win(i,220,1);let path=0;for(let k=a2;k<b2;k++)path+=hyp(SC[k],SC[k+1]);str[i]=path>1e-6?hyp(SC[a2],SC[b2])/path:1;
    zone[i]=zoneAt(zones,F[i].c,ar)}
  // grip thresholds adapt to this person and camera angle
  const g=F.filter(Boolean).map(f=>f.grip).sort((x,y)=>x-y);const lo=g.length?g[Math.floor(g.length*.1)]:0.8,hi=g.length?g[Math.floor(g.length*.9)]:1.8;
  const cut=hi-lo>0.35?lo+0.45*(hi-lo):1.15;
  const closed=F.map(f=>!!f&&(f.grip<cut||f.pinch<0.4));
  return{F,sz,v,str,dg,zone,closed,T}}

function classifyFrame(tf,i){const f=tf.F[i];if(!f)return"U";const v=tf.v[i],z=tf.zone[i],cl=tf.closed[i],dg=tf.dg[i];
  if(v>=TH.fast)return cl?"M":"R";
  if(z==="needle")return(tf.str[i]>=0.55||v<TH.still*2)?"S":"P";
  if(z==="bin")return"G";
  if(z==="stack")return"D";
  if(dg<-TH.grip)return"G";if(dg>TH.grip)return"D";
  if(v<TH.still)return cl?"H":"I";
  return tf.str[i]>0.75?(cl?"M":"R"):"P"}

function smoothLabels(lab,T){const n=lab.length,out=lab.slice();
  // majority vote over about ±100 ms
  for(let i=0;i<n;i++){const cnt={};for(let k=i;k>=0&&T[i]-T[k]<=100;k--)cnt[lab[k]]=(cnt[lab[k]]||0)+1;for(let k=i+1;k<n&&T[k]-T[i]<=100;k++)cnt[lab[k]]=(cnt[lab[k]]||0)+1;
    let best=lab[i],bc=cnt[best]||0;for(const c in cnt)if(cnt[c]>bc){best=c;bc=cnt[c]}out[i]=best}
  // merge pieces shorter than 150 ms into the longer neighbour
  for(let pass=0;pass<3;pass++){const sg=segs(out,T);for(let s=0;s<sg.length;s++){const g=sg[s];if(g.e-g.s>=150||sg.length<2)continue;
      const L=sg[s-1],R=sg[s+1];const to=!L?R.c:!R?L.c:(L.e-L.s>=R.e-R.s?L.c:R.c);for(let k=g.i0;k<=g.i1;k++)out[k]=to}}
  return out}
function segs(lab,T){const out=[];let s=0;const n=lab.length;
  for(let i=1;i<=n;i++){if(i===n||lab[i]!==lab[s]){const st=s===0?T[0]:(T[s-1]+T[s])/2,en=i===n?T[n-1]:(T[i-1]+T[i])/2;out.push({c:lab[s],s:st,e:en,i0:s,i1:i-1});s=i}}return out}

// Full analysis of one recording: motions per hand + automatic cycles
function analyzeHands(frames,ar,zones){
  const A=trackFeatures(frames,ar,"a",zones),B=trackFeatures(frames,ar,"b",zones);
  const la=smoothLabels(frames.map((_,i)=>classifyFrame(A,i)),A.T),lb=smoothLabels(frames.map((_,i)=>classifyFrame(B,i)),B.T);
  // re-grips: the hand closes again at the needle after being open for at least 150 ms
  const rg={a:[],b:[]};for(const[k,tf,lab]of[["a",A,la],["b",B,lb]]){let openSince=null;for(let i=0;i<tf.T.length;i++){if(!tf.F[i]){openSince=null;continue}
      if(!tf.closed[i]){if(openSince==null)openSince=tf.T[i]}else{if(openSince!=null&&tf.T[i]-openSince>=150&&lab[i]==="S")rg[k].push(tf.T[i]);openSince=null}}}
  return{la,lb,A,B,rg,cycles:detectCycles(frames,A,B,zones,ar)}}

function detectCycles(frames,A,B,zones,ar){const T=A.T,n=T.length;if(n<10)return{method:"none",cuts:[]};
  const has=t=>(zones||[]).some(z=>z.type===t);const ez=has("stack")?"stack":has("bin")?"bin":null;
  if(ez){const ev=[];
    for(const tf of[A,B]){let lastOut=-1e9,inside=false;for(let i=0;i<n;i++){const z=tf.F[i]?tf.zone[i]:null;
        if(z===ez){if(!inside&&T[i]-lastOut>=300)ev.push(T[i]);inside=true}else{if(inside)lastOut=T[i];inside=false;if(z!==ez&&tf.F[i])lastOut=Math.max(lastOut,T[i]-300)}}}
    ev.sort((x,y)=>x-y);const m=[];for(const e of ev)if(!m.length||e-m[m.length-1]>1000)m.push(e);
    if(m.length>=3){const g=median(m.slice(1).map((e,i)=>e-m[i]));const k=[m[0]];for(const e of m.slice(1))if(e-k[k.length-1]>=0.45*g)k.push(e);
      if(k.length>=2)return{method:ez,cuts:k}}}
  return periodCycles(frames,A,B)}

function periodCycles(frames,A,B){const T=A.T,n=T.length,t0=T[0],t1=T[n-1],dt=100;const m=Math.floor((t1-t0)/dt);if(m<40)return{method:"none",cuts:[]};
  // 10 Hz signal: both palm centres (in hand sizes), last known value carried forward
  const sig=[];let ia=0,last=[0,0,0,0];for(let s=0;s<=m;s++){const t=t0+s*dt;while(ia<n-1&&T[ia+1]<=t)ia++;const fa=A.F[ia],fb=B.F[ia];
    const v=[fa?fa.c.x/A.sz:last[0],fa?fa.c.y/A.sz:last[1],fb?fb.c.x/B.sz:last[2],fb?fb.c.y/B.sz:last[3]];last=v;sig.push(v)}
  const D=L=>{let a=0,c=0;for(let s=0;s+L<=m;s++){const p=sig[s],q=sig[s+L];a+=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2+(p[3]-q[3])**2;c++}return c?a/c:1e9};
  const Lmin=20,Lmax=Math.min(1200,Math.floor(m/2));if(Lmax<=Lmin)return{method:"none",cuts:[]};
  const d=[];for(let L=Lmin;L<=Lmax;L++)d.push(D(L));const avg=mean(d);
  let best=-1;for(let i=1;i<d.length-1;i++){if(d[i]<=d[i-1]&&d[i]<=d[i+1]&&d[i]<0.5*avg){best=i;break}}
  if(best<0)return{method:"none",cuts:[]};const P=best+Lmin;
  // reference: the stillest moment of the first period; then the closest match roughly one period later, again and again
  const spd=s=>s>0?Math.hypot(...sig[s].map((x,k)=>x-sig[s-1][k])):0;
  let ref=1;for(let s=1;s<Math.min(P,m);s++)if(spd(s)<spd(ref))ref=s;const R=sig[ref];const dist=s=>sig[s].reduce((a,x,k)=>a+(x-R[k])**2,0);
  const cuts=[t0+ref*dt];let cur=ref;while(true){const a=cur+Math.round(P*.7),b=Math.min(m,cur+Math.round(P*1.3));if(a>m)break;let bs=a;for(let s=a;s<=b;s++)if(dist(s)+0.02*spd(s)<dist(bs)+0.02*spd(bs))bs=s;cuts.push(t0+bs*dt);cur=bs;if(b>=m)break}
  return{method:"period",cuts:cuts.length>=2?cuts:[]}}

// Statistics for a saved study (cycles = [{s,e}] in ms)
function studyStats(st){const fr=st.frames,T=fr.map(f=>f.t),la=st.la,lb=st.lb;const cyc=st.cycles||[];
  const hands=handNames();const per=[];
  for(const c of cyc){const tot={a:{},b:{}};let va=0,regrip=0;
    for(let i=0;i<fr.length;i++){if(T[i]<c.s||T[i]>=c.e)continue;const d=((T[i+1]??T[i])-(T[i-1]??T[i]))/2||0;
      tot.a[la[i]]=(tot.a[la[i]]||0)+d;tot.b[lb[i]]=(tot.b[lb[i]]||0)+d;if(la[i]==="S"||lb[i]==="S")va+=d}
    for(const k of["a","b"])for(const t of(st.rg&&st.rg[k])||[])if(t>=c.s&&t<c.e)regrip++;
    per.push({dur:c.e-c.s,tot,va,regrip})}
  const durs=per.map(p=>p.dur/1000);const ct=mean(durs);
  const rating=st.rating||100,allow=st.allow??15;const basic=ct*rating/100,std=basic*(1+allow/100);
  const mot={a:{},b:{}};for(const k of["a","b"])for(const c of MORDER)mot[k][c]=mean(per.map(p=>(p.tot[k][c]||0)/1000));
  const vaS=mean(per.map(p=>p.va/1000));
  return{n:per.length,ct,min:durs.length?Math.min(...durs):0,max:durs.length?Math.max(...durs):0,sd:sd(durs),cv:ct?sd(durs)/ct:0,basic,std,smv:std/60,perHour:std?3600/std:0,
    mot,va:vaS,vaPct:ct?vaS/ct:0,regrip:mean(per.map(p=>p.regrip)),durs,hands}}
function handNames(){return{a:"Right hand",b:"Left hand"}}

// Improvement findings from the statistics
function findings(s){const out=[];if(!s.n)return out;const ct=s.ct,H=s.hands;const f=(lost,title,detail,sev)=>out.push({lost,title,detail,sev});
  for(const k of["a","b"]){const m=s.mot[k],hn=H[k].toLowerCase();
    const idle=(m.I||0),hold=(m.H||0);
    if((idle+hold)/ct>0.4)f(idle+hold*.5,`${H[k]} mostly idle or holding (${Math.round((idle+hold)/ct*100)}%)`,`The ${hn} works only part of the cycle. Share the work between both hands, or use a clamp, guide or fixture to hold the part.`,"high");
    if((m.R||0)/ct>0.15)f((m.R||0)*.5,`Long reaches with the ${hn}: ${(m.R||0).toFixed(1)} s per cycle`,"Bring the bundle / bin closer to the needle (normal working area, about 40 cm), at the same height as the machine bed.","mid");
    if((m.P||0)/ct>0.2)f((m.P||0)*.4,`Aligning / positioning with the ${hn}: ${(m.P||0).toFixed(1)} s per cycle`,"Use notches, edge guides, a folder or attachment so the parts line up without adjusting by hand.","mid");
    if((m.D||0)/ct>0.12)f((m.D||0)*.5,`Disposal takes ${(m.D||0).toFixed(1)} s per cycle (${hn})`,"Put the finished stack where the part falls naturally after sewing, e.g. a chute or a table extension next to the machine.","low")}
  const idleBoth=Math.min(s.mot.a.I||0,s.mot.b.I||0);if(idleBoth/ct>0.08)f(idleBoth,`Both hands waiting ${idleBoth.toFixed(1)} s per cycle`,"Check for waiting on bundles, thread breaks or the machine. Feed work before the operator runs out.","high");
  if(s.regrip>2)f(s.regrip*0.25,`${s.regrip.toFixed(1)} re-grips at the needle per cycle`,"Each re-grip stops the flow. Train one continuous guiding motion, check fabric slippage and the presser-foot pressure.","mid");
  if(s.cv>0.15)f(ct*s.cv*.5,`Cycle times vary ${Math.round(s.cv*100)}%`,`From ${s.min.toFixed(1)} to ${s.max.toFixed(1)} s. Look at the slow cycles in the replay: interruptions, re-work or a missing method.`,"mid");
  if(s.vaPct<0.4)f(0,`Sewing is only ${Math.round(s.vaPct*100)}% of the cycle`,"Most of the time is handling. Focus on pick-up, aligning and disposal to raise the value-added share.","info");
  const unk=((s.mot.a.U||0)+(s.mot.b.U||0))/2;if(unk/ct>0.2)f(0,`Hands not visible ${Math.round(unk/ct*100)}% of the time`,"Move the camera so both hands stay in the picture (higher, more from above). Results are less reliable.","info");
  return out.sort((x,y)=>y.lost-x.lost)}

// Line balance from the operation bulletin and the studies
function lineCalc(line,studies){const target=+line.target||0;const takt=target?3600/target:0;
  const ops=(line.ops||[]).map(o=>{const ss=studies.filter(s=>s.opId===o.id&&s.stats&&s.stats.n);const n=Math.max(1,+o.mp||1);
    const smvS=(+o.smv||0)*60;const act=ss.length?mean(ss.map(s=>s.stats.std)):0;const ct=(act||smvS)/n;
    return{op:o,studies:ss,n,smvS,act,ct,measured:!!ss.length,need:takt?(act||smvS)/takt:0,perHour:ct?3600/ct:0,diff:act&&smvS?(act-smvS)/smvS:null}});
  const valid=ops.filter(x=>x.ct>0);const bn=valid.reduce((a,x)=>!a||x.ct>a.ct?x:a,null);
  const sumCt=valid.reduce((a,x)=>a+x.ct,0);const mp=valid.reduce((a,x)=>a+x.n,0);
  const totSmv=ops.reduce((a,x)=>a+(+x.op.smv||0),0),totAct=ops.reduce((a,x)=>a+((x.act||x.smvS)/60),0);
  const out=bn?3600/bn.ct:0;
  return{ops,takt,target,bn,out,lbr:bn&&valid.length?sumCt/(valid.length*bn.ct):0,mp,totSmv,totAct,eff:out&&mp?out*totSmv/(60*mp):0,measured:ops.filter(x=>x.measured).length,
    need:takt?ops.reduce((a,x)=>a+x.need,0):0}}

// Keep the two hands as stable tracks: a = operator's right hand, b = operator's left hand.
// The tracker labels hand shape as seen in an un-mirrored camera image, so its "Left" is the operator's right hand.
// Position continuity decides when the label is unsure or both hands get the same label.
function assignHands(prev,hands){ // hands: [{lm:[flat], side:"a"|"b"|null, score}] ; prev: {a:{x,y}|null,b:{x,y}|null}
  const wr=h=>({x:h.lm[0],y:h.lm[1]});const out={a:null,b:null};if(!hands.length)return out;
  const cost=(h,k)=>{const p=prev[k];const d=p?hyp(p,wr(h)):300;const lab=h.side&&h.score>=0.6?(h.side===k?-120:180):0;return d+lab};
  if(hands.length===1){const h=hands[0];out[cost(h,"a")<=cost(h,"b")?"a":"b"]=h.lm;return out}
  const[h1,h2]=hands;if(cost(h1,"a")+cost(h2,"b")<=cost(h2,"a")+cost(h1,"b")){out.a=h1.lm;out.b=h2.lm}else{out.a=h2.lm;out.b=h1.lm}
  return out}

// Recorded WebM files have no duration until the end is read once; this forces it so seeking works.
function fixDuration(v){if(isFinite(v.duration)&&v.duration>0)return Promise.resolve();return new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;v.removeEventListener("timeupdate",h);try{v.currentTime=0}catch(e){}res()};const h=()=>{if(isFinite(v.duration))fin()};v.addEventListener("timeupdate",h);try{v.currentTime=1e101}catch(e){fin()}setTimeout(fin,2500)})}
const VCACHE={};
async function videoSrc(meta){if(!meta||!meta.file)return null;if(VCACHE[meta.file])return VCACHE[meta.file];if(!(NATIVE&&FS&&FS.getUri))return null;
  const type=meta.mime&&meta.mime.split(";")[0]||(meta.ext==="mp4"?"video/mp4":"video/webm");let url=null;
  try{const r=await FS.getUri({path:meta.file,directory:"DATA"});const direct=window.Capacitor.convertFileSrc(r.uri);
    try{const res=await fetch(direct);if(!res.ok)throw new Error("HTTP "+res.status);const b=await res.blob();if(!b.size)throw new Error("empty");url=URL.createObjectURL(b.type?b:new Blob([b],{type}))}
    catch(e){// fallback: read the file through the file plugin
      const d=await FS.readFile({path:meta.file,directory:"DATA"});const bin=atob(d.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);url=URL.createObjectURL(new Blob([u],{type}))}}
  catch(e){return null}
  VCACHE[meta.file]=url;return url}
async function writeBlob(blob,path,directory,onP){const CH=3*1024*1024;if(!blob||!blob.size)throw new Error("The video is empty");
  for(let off=0;off<blob.size;off+=CH){const b64=abToB64(await blob.slice(off,off+CH).arrayBuffer());
    if(off===0)await FS.writeFile({path,data:b64,directory,recursive:true});else await FS.appendFile({path,data:b64,directory});
    if(onP)onP(Math.min(1,(off+CH)/blob.size))}}
async function storeVideo(id,name,blob,mime,start){const ext=/mp4/.test(mime||"")?"mp4":"webm";const b=$("#busy");

  const prog=(l,p)=>{b.textContent=l+" "+Math.round(p*100)+"%"};b.hidden=false;
  try{const file="linestudy/videos/"+id+"."+ext;await writeBlob(blob,file,"DATA",p=>prog("Saving video…",p));
    let gallery=null;try{const g="Movies/LineStudy/"+safeName(name)+"_"+new Date().toISOString().slice(0,10)+"_"+id.slice(-4)+"."+ext;await writeBlob(blob,g,"EXTERNAL_STORAGE",p=>prog("Copying to Gallery…",p));gallery=g}
    catch(e){toast("Saved in the app, but couldn't copy it to the Gallery ("+(e.message||e)+"). Use Copy to Gallery on the study page.")}
    return{file,gallery,mime:mime||("video/"+ext),ext,start,size:blob.size,created:Date.now()}}

/* Video player in recording time (ms). videoTime = (t - offsetMs) / 1000 */
class VPlayer{
  constructor(root,dur,src,offsetMs,onTime,overlay){this.root=root;this.dur=Math.max(1,dur);this.off=offsetMs||0;this.onTime=onTime;this.overlay=overlay;this.t=0;this.playing=false;this.stopAt=null;this.onStop=null;this.stops=null;
    this.v=root.querySelector("video");this.cv=root.querySelector("canvas");this.rng=root.querySelector("input[type=range]");this.btn=root.querySelector("[data-pl=play]");this.tm=root.querySelector(".time");this.sp=root.querySelector("[data-pl=speed]");
    this.v.muted=true;this.v.playsInline=true;this.v.preload="auto";
    this.v.addEventListener("error",()=>{const er=this.v.error;const codes={1:"loading was stopped",2:"network/file read error",3:"the video data could not be decoded",4:"this video format is not supported on this phone"};
      const msg="Video can't play: "+(er?codes[er.code]||("error "+er.code):"unknown error")+(er&&er.message?" ("+er.message+")":"");this.showMsg(msg);toast(msg)});
    if(src)this.v.src=src;else this.showMsg("The video file could not be opened.");
    this.ready=new Promise(res=>{this.v.addEventListener("loadedmetadata",()=>{fixDuration(this.v).then(()=>{this.isReady=true;this.seek(this.t);res()})},{once:true});this.v.addEventListener("error",()=>res(),{once:true})});
    this.rng.max=this.dur;this.rng.addEventListener("input",()=>{this.pause();this.seek(+this.rng.value)});this.btn.addEventListener("click",()=>this.toggle());
    if(this.sp)this.sp.addEventListener("change",()=>{this.v.playbackRate=+this.sp.value})}
  showMsg(m){const st=this.root.querySelector(".vstage");if(!st)return;let d=st.querySelector(".vmsg");if(!d){d=document.createElement("div");d.className="vmsg";st.appendChild(d)}d.textContent=m}
  vt(t){return Math.max(0,(t-this.off)/1000)}
  seek(t){this.t=clamp(t,0,this.dur);try{if(this.isReady)this.v.currentTime=this.vt(this.t)}catch(e){}this.ui()}
  ui(){this.rng.value=this.t;this.tm.textContent=fmtClock(this.t)+" / "+fmtClock(this.dur);
    if(this.cv){const c=this.cv,x=c.getContext("2d");if(this.v.videoWidth&&(c.width!==this.v.videoWidth)){c.width=this.v.videoWidth;c.height=this.v.videoHeight}x.clearRect(0,0,c.width,c.height);if(this.overlay)this.overlay(c,this.t)}
    if(this.onTime)this.onTime(this.t)}
  toggle(){this.playing?this.pause():this.play()}
  play(){if(!this.isReady){this.playing=true;this.btn.textContent="Pause";this.ready.then(()=>{if(this.playing&&this.isReady){this.playing=false;this.play()}});return}
    if(this.t>=this.dur-40)this.seek(0);this.playing=true;this.btn.textContent="Pause";const p=this.v.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name!=="AbortError"){this.pause();this.showMsg("Video can't play: "+(e.message||e.name))}});let prev=this.t;
    const step=()=>{if(!this.playing)return;if(this.v.seeking){this.raf=requestAnimationFrame(step);return}this.t=Math.min(this.dur,this.v.currentTime*1000+this.off);if(this.t<prev-5)prev=this.t;
      if(this.stopAt!=null&&this.t>=this.stopAt){const s=this.stopAt,f=this.onStop;this.stopAt=null;this.onStop=null;this.pause();this.seek(s);if(f)f();return}
      if(this.stops){const b=this.stops.find(x=>x>prev+5&&x<=this.t);if(b!=null){this.pause();this.seek(b);if(this.onAutoStop)this.onAutoStop(b);return}}
      if(this.t>=this.dur||this.v.ended){this.pause();this.t=this.dur}prev=this.t;this.ui();if(this.playing)this.raf=requestAnimationFrame(step)};
    this.raf=requestAnimationFrame(step)}
  playTo(t,cb){this.stopAt=t;this.onStop=cb;this.play()}
  pause(){this.playing=false;cancelAnimationFrame(this.raf);try{this.v.pause()}catch(e){}this.btn.textContent="Play"}
  stop(){this.pause();this.stopAt=null;this.onStop=null;try{this.v.removeAttribute("src");this.v.load()}catch(e){}}
}

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function hashPw(pw,saltHex){const salt=saltHex?new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16))):crypto.getRandomValues(new Uint8Array(16));

  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:120000,hash:"SHA-256"},key,256);return{salt:hex(salt),hash:hex(bits)}}

const b32=bytes=>{let bits=0,val=0,o="";for(const x of bytes){val=(val<<8)|x;bits+=8;while(bits>=5){o+=B32[(val>>>(bits-5))&31];bits-=5}}return o};

function lineHead(l,active){const T=[["balance","Balance","chart"],["ops","Operations","list"],["lstudies","Studies","clock"]];

VIEWS.line=()=>{const l=S.line;if(!l)return VIEWS.lines();const ss=studiesOf(l.id);const c=lineCalc(l,ss);let h=lineHead(l,S.ltab);

    h+=`<div class="stats"><div class="stat"><b class="num">${c.target||"—"}</b><span>target pcs / hour</span></div><div class="stat"><b class="num">${c.takt?c.takt.toFixed(1):"—"}</b><span>takt time (s)</span></div>

      <div class="stat"><b class="num">${c.eff?pct(c.eff):"—"}</b><span>line efficiency at bottleneck</span></div><div class="stat"><b class="num">${c.measured}/${(l.ops||[]).length}</b><span>operations studied</span></div></div>`;
    if(!(l.ops||[]).length)h+=`<section class="panel empty">${ic("list","lg")}<h2>No operations yet</h2><p class="note">Import the operation bulletin or add operations by hand.</p>${can("edit")?`<div class="row"><button class="btn primary" data-act="bulletin">${ic("xls")}Import bulletin</button><button class="btn" data-act="editLine">Add by hand</button></div>`:""}</section>`;
    else{h+=`<section class="panel"><div class="row between"><h2>Line balance</h2><span class="note">seconds per piece at each station</span></div>${balanceChart(c)}
      <div class="legend"><span><i style="--c:var(--accent);height:10px"></i>Measured (study)</span><span><i style="--c:#b8c4bf;height:10px"></i>From bulletin SMV (not studied yet)</span><span><i style="--c:var(--miss)" class="dash"></i>Takt time</span><span><i style="--c:var(--slow);height:10px"></i>Bottleneck</span></div></section>`;
      if(c.bn)h+=`<section class="panel"><h2>What to do</h2><ul class="tips">${balanceTips(c).map(t=>`<li>${t}</li>`).join("")}</ul></section>`}
    h+=`<div class="row">${can("edit")?`<button class="btn sm" data-act="editLine">${ic("pen")}Edit line</button><button class="btn sm" data-act="bulletin">${ic("xls")}Import bulletin</button>`:""}
      <button class="btn sm" data-act="linePdf">${ic("pdf")}Report PDF</button><button class="btn sm" data-act="lineXls">${ic("xls")}Excel</button><button class="btn sm" data-act="sharePack">${ic("share")}Share with other phones</button></div>`}
  else if(S.ltab==="ops"){
    h+=`<section class="panel flush"><div class="tbl-wrap" style="border:0"><table><thead><tr><th>No</th><th>Operation</th><th>Machine</th><th class="r">MP</th><th class="r">SMV</th><th class="r">Actual</th><th class="r">Diff</th><th class="r">Pcs/h</th><th></th></tr></thead><tbody>
      ${c.ops.map(x=>`<tr class="${x===c.bn?"bn":""}"><td class="num">${esc(x.op.no??"")}</td><td style="white-space:normal;min-width:140px">${esc(x.op.name)}</td><td>${esc(x.op.machine||"")}</td><td class="r num">${x.n}</td><td class="r num">${(+x.op.smv||0).toFixed(2)}</td>
        <td class="r num">${x.act?(x.act/60).toFixed(2):"—"}</td><td class="r num" style="color:${x.diff==null?"inherit":x.diff>0.1?"var(--miss)":x.diff<-0.1?"var(--ok)":"inherit"}">${x.diff==null?"":(x.diff>0?"+":"")+Math.round(x.diff*100)+"%"}</td>
        <td class="r num">${x.perHour?Math.round(x.perHour):"—"}</td><td><button class="btn sm" data-act="studyOp" data-op="${esc(x.op.id)}">${ic("rec")}Study</button></td></tr>`).join("")||`<tr><td colspan="9" class="note">No operations.</td></tr>`}
      </tbody></table></div></section><p class="note">SMV and Actual are minutes per piece for one operator. Pcs/h is the station output with its manpower (MP). Tap Study to film an operator of that operation.</p>
      ${can("edit")?`<div class="row"><button class="btn sm" data-act="editLine">${ic("pen")}Edit operations</button><button class="btn sm" data-act="bulletin">${ic("xls")}Import bulletin</button></div>`:""}`}
  else{h+=ss.length?`<section class="panel"><div class="list">${ss.map(studyItem).join("")}</div></section>`:`<section class="panel empty">${ic("clock","lg")}<h2>No studies yet</h2><p class="note">Open Operations and tap Study, or combine studies made on other phones.</p></section>`;
    h+=`<div class="row"><button class="btn sm" data-act="importPick">${ic("merge")}Combine studies from other phones</button></div><input type="file" id="importFile" accept=".json,application/json,*/*" data-change="importFile" hidden>`}
  return h};
function balanceChart(c){const rows=c.ops.filter(x=>x.ct>0);if(!rows.length)return`<p class="note">Add SMV values to the operations to see the balance.</p>`;
  const mx=Math.max(c.takt||0,...rows.map(x=>x.ct))*1.08;
  return`<div class="bal">${c.takt?`<div class="takt${c.takt/mx>0.7?" lft":""}" style="left:calc(var(--lw) + (100% - var(--lw)) * ${(c.takt/mx).toFixed(4)})"><span>Takt ${c.takt.toFixed(1)} s</span></div>`:""}
    ${rows.map(x=>`<div class="brow"><span class="bl" title="${esc(x.op.name)}"><b class="num">${esc(x.op.no??"")}</b> ${esc(x.op.name)}</span><span class="bt"><i class="${x===c.bn?"bn":x.measured?"m":"p"}" style="width:${(x.ct/mx*100).toFixed(2)}%"></i><em class="num">${x.ct.toFixed(1)}${x.n>1?` <small>÷${x.n}</small>`:""}</em></span></div>`).join("")}</div>`}
function balanceTips(c){const t=[];const bn=c.bn;
  t.push(`Bottleneck: <b>${esc(bn.op.name)}</b>, ${bn.ct.toFixed(1)} s per piece${bn.n>1?" with "+bn.n+" operators":""}. The line can make about <b>${Math.round(c.out)}</b> pieces per hour.`);
  if(c.takt&&bn.ct>c.takt){const need=Math.ceil((bn.act||bn.smvS)/c.takt);t.push(`To reach the target of ${c.target}/h the bottleneck needs ${need} operator${need>1?"s":""} (now ${bn.n}), or its method must save ${(bn.ct-c.takt).toFixed(1)} s per piece.`)}
  const over=c.ops.filter(x=>c.takt&&x.ct>c.takt&&x!==bn);if(over.length)t.push(`Also above takt: ${over.map(x=>esc(x.op.name)).join(", ")}.`);
  const low=c.ops.filter(x=>x.ct>0&&bn&&x.ct<bn.ct*0.6);if(low.length)t.push(`Spare capacity at ${low.slice(0,4).map(x=>esc(x.op.name)).join(", ")}: these operators can take over small elements from the bottleneck.`);
  const slow=c.ops.filter(x=>x.diff!=null&&x.diff>0.15);if(slow.length)t.push(`Slower than the bulletin by more than 15%: ${slow.slice(0,4).map(x=>esc(x.op.name)+" (+"+Math.round(x.diff*100)+"%)").join(", ")}. Open their studies for the hand-motion details.`);
  if(c.measured<(c.ops||[]).length)t.push(`${(c.ops||[]).length-c.measured} operations are not studied yet; their bars use the bulletin SMV.`);
  return t}

const BI={rows:null,hdr:0,map:{},name:"",sheets:[],sheet:0,wb:null,from:"line"};
const BFIELDS=[["no","No / Sl","^(sl|s\\.?\\s?l|no\\b|#|seq|sr|op\\.?\\s*no|serial)"],["name","Operation","(operation|description|process|op\\.?\\s*name|task|details)"],["machine","Machine","(machine|m\\s*/\\s*c|^mc\\b|m\\.c|type of m)"],["smv","SMV (min)","(smv|sam\\b|std\\.?\\s*min|standard min|s\\.m\\.v)"],["mp","Manpower","(manpower|m\\s*/\\s*p|^mp\\b|operator|no\\.?\\s*of\\s*op|worker|w/p)"]];

ACT.bulletinFromEdit=()=>{BI.from="edit";BI.rows=null;go("bulletin")};
VIEWS.bulletin=()=>{const l=BI.from==="edit"?LE.l:S.line;let h=`<div class="row"><button class="link" data-act="biBack">← Back</button></div><div><div class="eyebrow">${esc(l?l.name:"Line")}</div><h1>Import bulletin</h1><p class="lead">Choose the operation bulletin (Excel .xlsx or .csv). The app finds the columns; check them before importing.</p></div>
  <section class="panel"><div class="row"><label class="btn primary" for="biFile">${ic("xls")}Choose Excel file</label><input type="file" id="biFile" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" data-change="biFile" hidden><span class="note">${esc(BI.name||"")}</span></div>
  ${BI.sheets.length>1?`<div class="field"><label class="lbl" for="biSheet">Sheet</label><select id="biSheet" data-change="biSheet">${BI.sheets.map((s,i)=>`<option value="${i}"${i===BI.sheet?" selected":""}>${esc(s)}</option>`).join("")}</select></div>`:""}</section>`;
  if(BI.rows){const R=BI.rows,ncol=Math.max(...R.slice(0,60).map(r=>r.length),1);const colName=i=>{const v=(R[BI.hdr]||[])[i];return String.fromCharCode(65+(i%26))+(v?": "+String(v).slice(0,24):"")};
    h+=`<section class="panel"><h2>Columns</h2><div class="field"><label class="lbl" for="biHdr">Header row</label><select id="biHdr" data-change="biHdr">${R.slice(0,25).map((r,i)=>`<option value="${i}"${i===BI.hdr?" selected":""}>Row ${i+1}: ${esc(r.filter(x=>x!=="").slice(0,4).join(" | ").slice(0,60))}</option>`).join("")}</select></div>
      <div class="grid">${BFIELDS.map(([k,lb])=>`<div class="field"><label class="lbl" for="bi_${k}">${lb}</label><select id="bi_${k}" data-change="biMap" data-k="${k}"><option value="-1">— not in the file —</option>${Array.from({length:ncol},(_,i)=>`<option value="${i}"${BI.map[k]===i?" selected":""}>${esc(colName(i))}</option>`).join("")}</select></div>`).join("")}</div></section>`;
    const ops=biOps();h+=`<section class="panel"><div class="row between"><h2>Preview</h2><span class="note">${ops.length} operations · total SMV ${ops.reduce((a,o)=>a+(+o.smv||0),0).toFixed(2)}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>No</th><th>Operation</th><th>Machine</th><th class="r">SMV</th><th class="r">MP</th></tr></thead><tbody>${ops.slice(0,12).map(o=>`<tr><td class="num">${esc(o.no)}</td><td style="white-space:normal">${esc(o.name)}</td><td>${esc(o.machine)}</td><td class="r num">${o.smv===""?"":(+o.smv).toFixed(3)}</td><td class="r num">${o.mp}</td></tr>`).join("")}${ops.length>12?`<tr><td colspan="5" class="note">… ${ops.length-12} more</td></tr>`:""}</tbody></table></div>
      <div class="row"><button class="btn primary" data-act="biImport" data-mode="replace"${ops.length?"":" disabled"}>Replace operations</button><button class="btn" data-act="biImport" data-mode="add"${ops.length?"":" disabled"}>Add to existing</button></div>
      <p class="note">Replacing keeps studies linked when the operation name stays the same.</p></section>`}
  return h};
ACT.biBack=()=>go(BI.from==="edit"?"lineEdit":"line");
function cellVal(v){if(v==null)return"";if(typeof v==="object"){if(v instanceof Date)return v.toISOString().slice(0,10);if("result" in v)return cellVal(v.result);if(v.richText)return v.richText.map(x=>x.text).join("");if("text" in v)return String(v.text);return""}return v}
function parseCsv(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","||c===";"||c==="\t"){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}if(f||row.length){row.push(f);rows.push(row)}
  return rows.map(r=>r.map(x=>{const s=String(x).trim();return s!==""&&!isNaN(+s)?+s:s}))}
ACT.biFile=async(d,el)=>{const f=el.files&&el.files[0];if(!f)return;BI.name=f.name;$("#busy").textContent="Reading…";$("#busy").hidden=false;
  try{if(/\.csv$/i.test(f.name)){BI.wb=null;BI.sheets=[];BI.rows=parseCsv(await f.text())}
    else{await loadLib("exceljs");const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());BI.wb=wb;BI.sheets=wb.worksheets.map(w=>w.name);
      let best=0,bs=-1;wb.worksheets.forEach((w,i)=>{const sc=w.actualRowCount||w.rowCount;if(sc>bs){bs=sc;best=i}});BI.sheet=best;BI.rows=sheetRows(wb.worksheets[best])}
    biDetect()}catch(e){toast("Couldn't read that file: "+(e.message||e));BI.rows=null}
  $("#busy").hidden=true;el.value="";render()};
function sheetRows(ws){const rows=[];ws.eachRow({includeEmpty:true},(r,n)=>{const a=[];r.eachCell({includeEmpty:true},(c,k)=>{a[k-1]=cellVal(c.value)});for(let i=0;i<a.length;i++)if(a[i]===undefined)a[i]="";rows[n-1]=a});for(let i=0;i<rows.length;i++)if(!rows[i])rows[i]=[];return rows}
ACT.biSheet=(d,el)=>{BI.sheet=+el.value;BI.rows=sheetRows(BI.wb.worksheets[BI.sheet]);biDetect();render()};
ACT.biHdr=(d,el)=>{BI.hdr=+el.value;biDetect(true);render()};
ACT.biMap=(d,el)=>{BI.map[d.k]=+el.value;render()};
function biDetect(keepHdr){const R=BI.rows;const re=BFIELDS.map(([k,,r])=>[k,new RegExp(r,"i")]);
  if(!keepHdr){let best=0,bs=0;for(let i=0;i<Math.min(25,R.length);i++){const sc=re.filter(([k,x])=>R[i].some(c=>typeof c==="string"&&x.test(c.trim()))).length;if(sc>bs){bs=sc;best=i}}BI.hdr=best}
  const H=(R[BI.hdr]||[]).map(c=>String(c||"").trim());BI.map={};
  for(const[k,x]of re){let idx=-1;for(let i=0;i<H.length;i++){if(x.test(H[i])&&!Object.values(BI.map).includes(i)){idx=i;break}}BI.map[k]=idx}
  if(BI.map.name<0){let best=-1,bl=0;const sample=R.slice(BI.hdr+1,BI.hdr+20);for(let i=0;i<H.length;i++){const L=mean(sample.map(r=>typeof r[i]==="string"?r[i].length:0));if(L>bl){bl=L;best=i}}BI.map.name=best}}
function biOps(){const R=BI.rows,m=BI.map,out=[];if(m.name==null||m.name<0)return out;
  for(let i=BI.hdr+1;i<R.length;i++){const r=R[i]||[];const name=String(r[m.name]??"").trim();if(!name)continue;
    const smvRaw=m.smv>=0?r[m.smv]:"";const smv=typeof smvRaw==="number"?smvRaw:parseFloat(String(smvRaw).replace(",","."));
    if(/^(total|grand total|sum)\b/i.test(name))continue;if(m.smv>=0&&!(smv>0))continue;
    const mpRaw=m.mp>=0?r[m.mp]:1;const mp=Math.max(1,Math.round(+mpRaw||1));
    out.push({id:uid(),no:m.no>=0?r[m.no]:out.length+1,name,machine:m.machine>=0?String(r[m.machine]??"").trim():"",smv:isFinite(smv)?+smv.toFixed(4):"",mp})}
  return out}
ACT.biImport=async d=>{const ops=biOps();if(!ops.length)return;const l=BI.from==="edit"?LE.l:JSON.parse(JSON.stringify(S.line));
  if(d.mode==="replace"){const old=l.ops||[];for(const o of ops){const m=old.find(x=>x.name.trim().toLowerCase()===o.name.toLowerCase());if(m)o.id=m.id}l.ops=ops}else l.ops=(l.ops||[]).concat(ops);
  if(BI.from==="edit"){toast(ops.length+" operations added. Save the line to keep them.");go("lineEdit");return}
  await DB.putLine(l);S.line=l;S.ltab="ops";toast(ops.length+" operations imported");go("line")};

const RC={stream:null,rec:null,chunks:[],recording:false,t0:0,raf:0,last:0,mime:"",err:""};
VIEWS.record=()=>`<div class="row"><button class="link" data-act="go" data-v="setup">← Back</button></div>
  <div><div class="eyebrow">${esc(nsTitle())}</div><h1>Film the operator</h1></div>
  <div class="stage wide" id="stage"><video id="rv" playsinline muted></video><canvas id="rc"></canvas>
    <div class="hud"><span class="pill" id="hudL">Preview</span><span class="pill num" id="hudR"></span></div><div class="msg" id="rmsg"><p class="note" id="rmsgT">Opening camera…</p></div></div>
  <div class="row"><button class="btn primary big" id="recBtn" data-act="recToggle" disabled>${ic("rec")}Start filming</button></div>
  <p class="note">The coloured lines show the fingers the app can see. Orange = right hand, blue = left hand. Keep both visible.</p>`;
function nsTitle(){const l=lineOf(NS.lineId),o=opOf(l,NS.opId);return[l&&l.name,o?o.name:NS.opName,NS.operator].filter(Boolean).join(" · ")}
function recMsg(t){const m=$("#rmsg");if(!m)return;if(t){m.hidden=false;$("#rmsgT").textContent=t}else m.hidden=true}
MOUNTS.record=async()=>{RC.recording=false;
  if(!navigator.mediaDevices){recMsg(NATIVE?"This phone's browser engine has no camera support. Update Android System WebView from the Play Store.":"The camera needs an https:// page.");return}
  Hands.load().catch(()=>{});
  try{RC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false});
    const v=$("#rv");v.srcObject=RC.stream;await v.play();const c=$("#rc");c.width=v.videoWidth;c.height=v.videoHeight;$("#stage").style.aspectRatio=v.videoWidth+"/"+v.videoHeight;recMsg(null);$("#recBtn").disabled=false;keepAwake();
    cancelAnimationFrame(RC.raf);RC.raf=requestAnimationFrame(recLoop)}
  catch(e){recMsg(e&&e.name==="NotAllowedError"?"Camera permission was refused. Open Android Settings → Apps → Line Study → Permissions → Camera → Allow.":"Couldn't open the camera: "+(e.message||e))}};
function recLoop(){if(S.view!=="record")return;RC.raf=requestAnimationFrame(recLoop);const v=$("#rv");if(!v||v.readyState<2)return;
  if(RC.recording)$("#hudR").textContent=fmtClock(performance.now()-RC.t0);
  const now=performance.now();if(!Hands.lm||now-RC.last<(RC.recording?250:120))return;RC.last=now;
  const hs=Hands.detect(v);const c=$("#rc"),x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);for(const h of hs)drawHand(x,h.lm,c.width,c.height,HCOL[h.side||"a"],Math.max(3,c.width/250));
  if(!RC.recording)$("#hudL").textContent=hs.length===2?"2 hands ✓":hs.length===1?"1 hand":"No hands";}
function stopCamera(){cancelAnimationFrame(RC.raf);if(RC.rec){try{RC.rec.stop()}catch(e){}RC.rec=null}RC.recording=false;if(RC.stream){RC.stream.getTracks().forEach(t=>t.stop());RC.stream=null}}
ACT.recToggle=async()=>{if(RC.recording)return finishRec();
  if(!window.MediaRecorder)return toast("This phone can't record video in the app. Film with the camera app and use Video from gallery.");
  const types=["video/webm;codecs=vp8","video/webm;codecs=vp9","video/webm","video/mp4"];const mt=types.find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}})||"";
  try{RC.chunks=[];const r=new MediaRecorder(RC.stream,mt?{mimeType:mt,videoBitsPerSecond:8000000}:{videoBitsPerSecond:8000000});RC.mime=r.mimeType||mt||"video/webm";r.ondataavailable=e=>{if(e.data&&e.data.size)RC.chunks.push(e.data)};r.start(1000);RC.rec=r}
  catch(e){return toast("Couldn't start recording: "+(e.message||e))}
  RC.recording=true;RC.t0=performance.now();beep(1320,.2);const b=$("#recBtn");b.innerHTML=ic("rec")+"Stop";b.classList.add("stop");const h=$("#hudL");h.textContent="Filming";h.classList.add("rec")};
async function finishRec(){const r=RC.rec;RC.rec=null;RC.recording=false;beep(440,.25);const b=$("#recBtn");if(b){b.disabled=true;b.textContent="Finishing video…"}
  if(r&&r.state!=="inactive")await new Promise(res=>{r.onstop=()=>res();try{r.stop()}catch(e){res()}setTimeout(res,5000)});
  const blob=new Blob(RC.chunks,{type:(RC.mime||"video/webm").split(";")[0]});RC.chunks=[];
  if(blob.size<5000){toast("The video came out empty. Try again.");render();return}
  A.init(blob,blob.type,false);go("zones")}

  Object.assign(this,{blob,mime:mime||"video/webm",fromFile,url:URL.createObjectURL(blob),own:true,zones:null,frames:null,la:"",lb:"",rg:null,cuts:[],skip:[],method:"",ar:16/9,dur:0,fps:0,edit:null,rating:100,allow:+pref("allow",15),keep:!fromFile||blob.size<150*1048576})}};
