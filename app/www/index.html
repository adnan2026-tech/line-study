const ZN={tool:"needle",drag:null,frameT:0};
VIEWS.zones=()=>`<div class="row"><button class="link" data-act="go" data-v="${A.fromFile?"setup":"record"}">← ${A.fromFile?"Back":"Film again"}</button></div>
  <div><div class="eyebrow">${esc(nsTitle())}</div><h1>Mark the work zones</h1><p class="lead">Drag a box on the picture for each zone. The needle zone is needed to recognise sewing; the bin and stack zones make pick-up, disposal and cycle counting exact.</p></div>
  <div class="seg zt">${Object.entries(ZT).map(([k,z])=>`<button class="${ZN.tool===k?"on":""}" data-act="znTool" data-k="${k}" style="--zc:${z.c}"><i></i>${z.l.split(" (")[0].replace("Needle / work point","Needle")}</button>`).join("")}</div>
  <section class="panel flush"><div class="vstage zstage" id="zst"><video id="zv" playsinline muted preload="auto"></video><canvas id="zc"></canvas></div>
   <div class="pad"><input type="range" id="zr" min="0" max="1000" value="300" aria-label="Choose a frame"><div class="row between"><span class="note" id="zHands">Looking for hands…</span><button class="btn sm" data-act="znClear">Clear zones</button></div></div></section>
  ${lastZones()?`<button class="btn" data-act="znLast">${ic("grid")}Use the zones from the last study of this operation</button>`:""}
  <button class="btn primary big" data-act="znGo">${ic("hand")}Analyse the hands</button>
  <p class="note">Analysis goes through every frame and takes about ${pref("rate","0.5")==="0.3"?"3×":"2×"} the video length. Keep the app open.</p>`;
function lastZones(){const s=S.studies.find(x=>NS.opId?x.opId===NS.opId:x.opName===NS.opName);return s&&s.zones&&s.zones.length?s.zones:null}
MOUNTS.zones=()=>{const v=$("#zv"),c=$("#zc"),r=$("#zr");if(!A.zones)A.zones=[];
  v.addEventListener("loadedmetadata",()=>{fixDuration(v).then(()=>{A.dur=v.duration*1000;A.ar=v.videoWidth/v.videoHeight;c.width=v.videoWidth;c.height=v.videoHeight;$("#zst").style.aspectRatio=v.videoWidth+"/"+v.videoHeight;try{v.currentTime=v.duration*.3}catch(e){}})},{once:true});
  v.addEventListener("seeked",()=>znDraw(true));v.src=A.url;
  r.addEventListener("input",()=>{if(isFinite(v.duration))v.currentTime=v.duration*(+r.value/1000)});
  Hands.load().then(()=>znDraw(true)).catch(()=>{const h=$("#zHands");if(h)h.textContent="Couldn't start hand tracking on this phone."});
  const pt=ev=>{const b=c.getBoundingClientRect();return{x:clamp((ev.clientX-b.left)/b.width,0,1),y:clamp((ev.clientY-b.top)/b.height,0,1)}};
  c.addEventListener("pointerdown",ev=>{ev.preventDefault();try{c.setPointerCapture(ev.pointerId)}catch(e){}const p=pt(ev);ZN.drag={x1:p.x,y1:p.y,x2:p.x,y2:p.y}});
  c.addEventListener("pointermove",ev=>{if(!ZN.drag)return;const p=pt(ev);ZN.drag.x2=p.x;ZN.drag.y2=p.y;znDraw()});
  const up=()=>{const d=ZN.drag;ZN.drag=null;if(d&&Math.abs(d.x2-d.x1)>0.03&&Math.abs(d.y2-d.y1)>0.03){A.zones=A.zones.filter(z=>z.type!==ZN.tool);A.zones.push({type:ZN.tool,x:Math.min(d.x1,d.x2),y:Math.min(d.y1,d.y2),w:Math.abs(d.x2-d.x1),h:Math.abs(d.y2-d.y1)});
      const order=Object.keys(ZT);const nx=order.find(k=>!A.zones.some(z=>z.type===k));if(nx){ZN.tool=nx;document.querySelectorAll("[data-act=znTool]").forEach(b=>b.classList.toggle("on",b.dataset.k===nx))}}znDraw()};
  c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up)};
let znHands=[];
function znDraw(detect){const v=$("#zv"),c=$("#zc");if(!v||!c||!c.width)return;const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);
  if(detect&&Hands.lm&&v.readyState>=2){znHands=Hands.detect(v);const h=$("#zHands");if(h)h.textContent=znHands.length===2?"Both hands found in this frame ✓":znHands.length===1?"Only one hand found in this frame":"No hands found in this frame. Slide to another moment."}
  for(const h of znHands)drawHand(x,h.lm,c.width,c.height,HCOL[h.side||"a"],Math.max(3,c.width/260));
  drawZones(x,c.width,c.height,A.zones);const d=ZN.drag;if(d){x.save();x.strokeStyle=ZT[ZN.tool].c;x.lineWidth=Math.max(3,c.width/250);x.strokeRect(Math.min(d.x1,d.x2)*c.width,Math.min(d.y1,d.y2)*c.height,Math.abs(d.x2-d.x1)*c.width,Math.abs(d.y2-d.y1)*c.height);x.restore()}}
function stopZoneView(){const v=$("#zv");if(v){try{v.pause();v.removeAttribute("src");v.load()}catch(e){}}}
ACT.znTool=d=>{ZN.tool=d.k;document.querySelectorAll("[data-act=znTool]").forEach(b=>b.classList.toggle("on",b.dataset.k===d.k))};
ACT.znClear=()=>{A.zones=[];ZN.tool="needle";render()};
ACT.znLast=()=>{A.zones=JSON.parse(JSON.stringify(lastZones()));znDraw();toast("Zones copied. Check they still fit the picture.")};
ACT.znGo=()=>{if(!A.zones.some(z=>z.type==="needle")&&!confirm("No needle zone: the app can't tell sewing from other handling, and cycles are found from the rhythm of the motion only. Continue anyway?"))return;go("analyze")};

/* ===== Analyse every frame ===== */
const AN={cancel:false};
VIEWS.analyze=()=>`<div><div class="eyebrow">${esc(nsTitle())}</div><h1>Analysing hands</h1><p class="lead">The app goes through the video frame by frame and tracks 21 points on each hand.</p></div>
  <section class="panel flush"><div class="vstage" id="ast"><video id="av" playsinline muted preload="auto"></video><canvas id="ac"></canvas></div>
  <div class="pad"><div class="bar big"><i id="aBar" style="width:0%"></i></div><div class="row between"><span class="num note" id="aPct">0%</span><span class="note" id="aInfo">Starting…</span></div></div></section>
  <button class="btn" data-act="anCancel">Cancel</button>`;
ACT.anCancel=()=>{AN.cancel=true;go("zones")};
MOUNTS.analyze=async()=>{AN.cancel=false;keepAwake();const v=$("#av"),c=$("#ac");
  try{await Hands.load()}catch(e){toast("Couldn't start hand tracking: "+(e.message||e));return}
  await new Promise((res,rej)=>{v.addEventListener("loadedmetadata",res,{once:true});v.addEventListener("error",()=>rej(new Error("the video can't be opened")),{once:true});v.src=A.url}).catch(e=>{toast("Analysis failed: "+e.message)});
  if(AN.cancel||S.view!=="analyze")return;await fixDuration(v);A.dur=v.duration*1000;A.ar=v.videoWidth/v.videoHeight;c.width=v.videoWidth;c.height=v.videoHeight;$("#ast").style.aspectRatio=v.videoWidth+"/"+v.videoHeight;
  const frames=[];let prev={a:null,b:null};const x=c.getContext("2d");const t0=performance.now();let n=0;
  const handle=t=>{const hs=Hands.detect(v);const o=assignHands(prev,hs);prev={a:o.a?{x:o.a[0],y:o.a[1]}:prev.a,b:o.b?{x:o.b[0],y:o.b[1]}:prev.b};frames.push({t:Math.round(t),a:o.a,b:o.b});n++;
    if(n%3===0){x.clearRect(0,0,c.width,c.height);drawZones(x,c.width,c.height,A.zones,.1);drawHand(x,o.a,c.width,c.height,HCOL.a,Math.max(3,c.width/250));drawHand(x,o.b,c.width,c.height,HCOL.b,Math.max(3,c.width/250));
      const p=Math.min(1,t/A.dur);$("#aBar").style.width=(p*100).toFixed(1)+"%";$("#aPct").textContent=Math.round(p*100)+"%";const el=(performance.now()-t0)/1000;$("#aInfo").textContent=p>0.03?"About "+Math.max(1,Math.round(el/p-el))+" s left · "+frames.filter(f=>f.a||f.b).length+" frames with hands":"Tracking…"}};
  let rate=+pref("rate","0.5");v.playbackRate=rate;
  if("requestVideoFrameCallback" in HTMLVideoElement.prototype){let lastPF=-1,lastT=-1;
    await new Promise(res=>{const cb=(now,meta)=>{if(AN.cancel||S.view!=="analyze"){res();return}const t=meta.mediaTime*1000;
        if(t>lastT){handle(t);lastT=t;if(lastPF>=0&&meta.presentedFrames-lastPF>2&&rate>0.15){rate=Math.max(0.15,rate*0.85);v.playbackRate=rate}lastPF=meta.presentedFrames}
        if(v.ended||t>=A.dur-1){res();return}v.requestVideoFrameCallback(cb)};
      v.requestVideoFrameCallback(cb);v.addEventListener("ended",()=>setTimeout(res,300),{once:true});v.play().catch(e=>{toast("Couldn't play the video: "+(e.message||e));res()})})}
  else{const step=1000/20;for(let t=0;t<A.dur&&!AN.cancel&&S.view==="analyze";t+=step){await new Promise(r=>{v.addEventListener("seeked",r,{once:true});v.currentTime=t/1000});handle(t)}}
  try{v.pause()}catch(e){}
  if(AN.cancel||S.view!=="analyze")return;
  const seen=frames.filter(f=>f.a||f.b).length;if(seen<15){toast("Hardly any hands were found. Check the camera view and light, then try again.");go("zones");return}
  A.frames=frames;A.fps=frames.length/(A.dur/1000);reanalyse();go("review")};
function reanalyse(keepCuts){const r=analyzeHands(A.frames,A.ar,A.zones);A.la=r.la.join("");A.lb=r.lb.join("");A.rg=r.rg;if(!keepCuts){A.cuts=r.cycles.cuts.slice();A.method=r.cycles.method;A.skip=[]}}
const curCycles=()=>{const c=[];for(let i=0;i+1<A.cuts.length;i++){const s=A.cuts[i],e=A.cuts[i+1];if(!A.skip.includes(Math.round(s)))c.push({s,e})}return c};
const draftStudy=()=>({frames:A.frames,la:A.la,lb:A.lb,rg:A.rg,cycles:curCycles(),rating:A.rating,allow:A.allow});

/* ===== Review: replay, motions per hand, cycles ===== */
VIEWS.review=()=>{const st=studyStats(draftStudy());const ed=A.edit;
  return`<div class="row"><button class="link" data-act="rvBack">← ${ed?"Back without saving":"Zones"}</button></div>
  <div><div class="eyebrow">${esc(ed?[ed.opName,ed.operator].filter(Boolean).join(" · "):nsTitle())}</div><h1>Check the cycles</h1>
  <p class="lead">${A.cuts.length>1?`The app found <b>${Math.max(0,A.cuts.length-1)}</b> cycles (${A.method==="stack"?"each time a piece goes to the finished stack":A.method==="bin"?"each pick-up from the bin":"from the rhythm of the motion"}). Play through and fix any cut that is wrong.`:"No repeating cycle was found. Play the video and set a cut at the same moment of each cycle (e.g. when the piece goes on the stack)."}</p></div>
  <section class="panel flush pinv">${A.url?vplayerHtml("rvP","rvCap"):cplayerHtml("rvP","rvCap")}</section>
  <section class="panel"><div class="lanes" id="lanes">${lanesHtml()}</div>
   <div class="legend">${MORDER.split("").filter(k=>k!=="U").map(k=>`<span><i style="--c:${MOT[k].c};height:10px"></i>${MOT[k].l}</span>`).join("")}</div>
   <div class="row"><button class="btn sm" data-act="cutAdd" data-keep>${ic("cut")}Cut here</button><button class="btn sm" data-act="cutDel" data-keep>Remove nearest cut</button><button class="btn sm" data-act="cutAuto">Find cycles again</button></div></section>
  <section class="panel"><h2>Cycles</h2><div class="tbl-wrap"><table><thead><tr><th>#</th><th class="r">Start</th><th class="r">Time</th><th class="r">Sewing</th><th></th></tr></thead><tbody id="cycT">${cycRows()}</tbody></table></div>
   <p class="note">Leave out a cycle that was interrupted (thread break, talking, re-work) so it does not distort the time.</p></section>
  <section class="panel" id="rvSum">${sumHtml(st)}</section>
  <section class="panel"><div class="grid"><div class="field"><label class="lbl" for="rvRat">Performance rating %</label><input type="number" id="rvRat" value="${A.rating}" min="50" max="150" data-input="rvNum" data-k="rating"></div>
   <div class="field"><label class="lbl" for="rvAll">Allowance % (personal, fatigue, delay)</label><input type="number" id="rvAll" value="${A.allow}" min="0" max="60" data-input="rvNum" data-k="allow"></div></div>
   ${ed?"":`<label class="check"><input type="checkbox" id="rvKeep" data-change="rvKeep"${A.keep?" checked":""}> Keep the video with the study (${(A.blob.size/1048576).toFixed(1)} MB) for replay</label>`}
   <button class="btn primary big" data-act="rvSave">${ic("check")}Save study</button></section>`};
function sumHtml(st){return`<div class="stats"><div class="stat"><b class="num">${st.n?st.ct.toFixed(1):"—"}</b><span>avg cycle time (s), ${st.n} cycles</span></div><div class="stat"><b class="num">${st.n?st.smv.toFixed(3):"—"}</b><span>standard minutes (SMV)</span></div>
  <div class="stat"><b class="num">${st.n?Math.round(st.perHour):"—"}</b><span>pieces / hour</span></div><div class="stat"><b class="num">${st.n?pct(st.vaPct):"—"}</b><span>sewing (value added)</span></div></div>`}
function cycRows(){const cs=[];for(let i=0;i+1<A.cuts.length;i++){const s=A.cuts[i],e=A.cuts[i+1];const sk=A.skip.includes(Math.round(s));let va=0,tot=0;const F=A.frames;
    for(let k=0;k<F.length;k++){if(F[k].t<s||F[k].t>=e)continue;const d=((F[k+1]||F[k]).t-(F[k-1]||F[k]).t)/2;tot+=d;if(A.la[k]==="S"||A.lb[k]==="S")va+=d}
    cs.push(`<tr class="${sk?"skip":""}"><td class="num">${i+1}</td><td class="r num"><button class="link" data-act="cycGo" data-t="${s}">${fmtClock(s)}</button></td><td class="r num">${((e-s)/1000).toFixed(1)} s</td><td class="r num">${tot?pct(va/tot):""}</td><td><button class="btn sm ghost" data-act="cycSkip" data-t="${Math.round(s)}">${sk?"Use again":"Leave out"}</button></td></tr>`)}
  return cs.join("")||`<tr><td colspan="5" class="note">No cycles yet.</td></tr>`}
function lanesHtml(){const F=A.frames,T=F.map(f=>f.t),dur=Math.max(A.dur,T[T.length-1]||1);const lane=(lab,name,cls)=>{const sg=segs(lab.split(""),T);
    return`<div class="lane"><span class="ln">${name}</span><div class="lt ${cls}" data-dur="${dur}">${sg.map(g=>`<i style="left:${(g.s/dur*100).toFixed(3)}%;width:${Math.max(.15,(g.e-g.s)/dur*100).toFixed(3)}%;background:${MOT[g.c].c}" title="${MOT[g.c].l}"></i>`).join("")}<b class="ph"></b></div></div>`};
  const cyc=[];for(let i=0;i+1<A.cuts.length;i++){const s=A.cuts[i],e=A.cuts[i+1],sk=A.skip.includes(Math.round(s));cyc.push(`<i class="cy${sk?" sk":""}${i%2?" alt":""}" style="left:${(s/dur*100).toFixed(3)}%;width:${((e-s)/dur*100).toFixed(3)}%">${i+1}</i>`)}
  return lane(A.la,"Right","")+lane(A.lb,"Left","")+`<div class="lane"><span class="ln">Cycles</span><div class="lt cyl" data-dur="${dur}">${cyc.join("")}${A.cuts.map(t=>`<em style="left:${(t/dur*100).toFixed(3)}%"></em>`).join("")}<b class="ph"></b></div></div>`}
function refreshReview(){const l=$("#lanes");if(l){l.innerHTML=lanesHtml();bindLanes()}const c=$("#cycT");if(c)c.innerHTML=cycRows();const s=$("#rvSum");if(s)s.innerHTML=sumHtml(studyStats(draftStudy()));if(player)rvTime(player.t)}
function bindLanes(){document.querySelectorAll("#lanes .lt").forEach(el=>el.addEventListener("click",e=>{const r=el.getBoundingClientRect();if(!player)return;player.pause();player.seek(clamp((e.clientX-r.left)/r.width,0,1)*+el.dataset.dur)}))}
function rvTime(t){const dur=+($("#lanes .lt")||{dataset:{dur:1}}).dataset.dur;document.querySelectorAll("#lanes .ph").forEach(p=>p.style.left=clamp(t/dur*100,0,100)+"%");
  const i=nearestFrame(A.frames,t);const cap=$("#rvCap");if(cap&&i>=0)cap.textContent=`Right: ${MOT[A.la[i]].l} · Left: ${MOT[A.lb[i]].l}`}
function rvOverlay(cv,t){const i=nearestFrame(A.frames,t);const x=cv.getContext("2d");drawZones(x,cv.width,cv.height,A.zones,.08);if(i<0)return;const f=A.frames[i];const lw=Math.max(3,cv.width/250);drawHand(x,f.a,cv.width,cv.height,HCOL.a,lw);drawHand(x,f.b,cv.width,cv.height,HCOL.b,lw)}
MOUNTS.review=()=>{const dur=Math.max(A.dur,A.frames[A.frames.length-1].t);
  player=A.url?new VPlayer($("#rvP"),dur,A.url,0,rvTime,rvOverlay):new CPlayer($("#rvP"),dur,A.ar,(cv,t)=>{const x=cv.getContext("2d");x.fillStyle="#0f1716";x.fillRect(0,0,cv.width,cv.height);rvOverlay(cv,t)},rvTime);
  bindLanes();player.seek(A.cuts[0]||0)};
ACT.rvBack=()=>{if(A.edit){S.study=A.edit;go("study")}else go("zones")};
ACT.cutAdd=()=>{if(!player)return;player.pause();const t=Math.round(player.t);if(A.cuts.some(c=>Math.abs(c-t)<300))return toast("There is already a cut here.");A.cuts.push(t);A.cuts.sort((a,b)=>a-b);refreshReview();toast("Cut added at "+fmtClock(t))};
ACT.cutDel=()=>{if(!player||!A.cuts.length)return;player.pause();const t=player.t;let k=0;A.cuts.forEach((c,i)=>{if(Math.abs(c-t)<Math.abs(A.cuts[k]-t))k=i});const c=A.cuts[k];A.cuts.splice(k,1);refreshReview();toast("Cut at "+fmtClock(c)+" removed")};
ACT.cutAuto=()=>{reanalyse();refreshReview();toast(Math.max(0,A.cuts.length-1)+" cycles found")};
ACT.cycGo=d=>{if(!player)return;player.pause();player.seek(+d.t);window.scrollTo({top:0,behavior:"smooth"})};
ACT.cycSkip=d=>{const t=+d.t;A.skip=A.skip.includes(t)?A.skip.filter(x=>x!==t):A.skip.concat(t);refreshReview()};
ACT.rvNum=(d,el)=>{A[d.k]=+el.value||0;const s=$("#rvSum");if(s)s.innerHTML=sumHtml(studyStats(draftStudy()))};
ACT.rvKeep=(d,el)=>{A.keep=el.checked};
ACT.rvSave=async()=>{const cyc=curCycles();if(!cyc.length&&!confirm("There are no cycles, so no cycle time can be calculated. Save anyway?"))return;
  const ed=A.edit,l=ed?lineOf(ed.lineId):lineOf(NS.lineId),o=ed?null:opOf(l,NS.opId);
  const m=ed?{...ed}:{id:uid(),lineId:l?l.id:"",opId:o?o.id:"",opName:o?o.name:NS.opName.trim(),opNo:o?o.no:"",smvRef:o?+o.smv||0:0,lineName:l?l.name:"",operator:NS.operator.trim(),empId:NS.empId.trim(),device:deviceName(),by:S.user.name,created:Date.now(),
    dur:Math.round(A.dur),ar:A.ar,fps:+A.fps.toFixed(1),zones:A.zones,method:A.method};
  Object.assign(m,{cycles:cyc,cuts:A.cuts.slice(),skip:A.skip.slice(),rating:A.rating,allow:A.allow});
  m.stats=studyStats({...draftStudy(),cycles:cyc});delete m.stats.durs;m.durs=studyStats(draftStudy()).durs;
  const data={id:m.id,frames:A.frames,la:A.la,lb:A.lb,rg:A.rg};
  if(!ed&&A.keep&&A.blob){try{m.video=await storeVideo(m.id,(m.opName||"study")+"_"+(m.operator||""),A.blob,A.mime,0)}catch(e){toast("Couldn't keep the video ("+(e.message||e)+"). The study is saved without it.")}}
  try{await DB.putStudy(m,data)}catch(e){return toast("Couldn't save the study: "+(e.message||e))}
  S.study=m;toast("Study saved");go("study")};

/* canvas-only player for studies whose video was not kept */
class CPlayer{constructor(root,dur,ar,draw,onTime){this.root=root;this.dur=dur;this.draw=draw;this.onTime=onTime;this.t=0;this.playing=false;this.cv=root.querySelector("canvas");this.cv.width=960;this.cv.height=Math.round(960/ar);
    this.rng=root.querySelector("input[type=range]");this.btn=root.querySelector("[data-pl=play]");this.tm=root.querySelector(".time");this.rng.max=dur;this.rng.addEventListener("input",()=>{this.pause();this.seek(+this.rng.value)});this.btn.addEventListener("click",()=>this.playing?this.pause():this.play())}
  seek(t){this.t=clamp(t,0,this.dur);this.rng.value=this.t;this.tm.textContent=fmtClock(this.t)+" / "+fmtClock(this.dur);this.draw(this.cv,this.t);if(this.onTime)this.onTime(this.t)}
  play(){if(this.t>=this.dur-40)this.t=0;this.playing=true;this.btn.textContent="Pause";let last=performance.now();const st=()=>{if(!this.playing)return;const n=performance.now();this.t+=n-last;last=n;if(this.t>=this.dur){this.t=this.dur;this.pause()}this.seek(this.t);if(this.playing)this.raf=requestAnimationFrame(st)};this.raf=requestAnimationFrame(st)}
  pause(){this.playing=false;cancelAnimationFrame(this.raf);this.btn.textContent="Play"}stop(){this.pause()}}
const cplayerHtml=(id,cap)=>`<div class="player" id="${id}"><div class="vstage"><canvas class="solo"></canvas>${cap?`<div class="vcap" id="${cap}"></div>`:""}</div><div class="pctl"><button class="btn sm" data-pl="play" style="min-width:76px">Play</button><input type="range" min="0" step="10" value="0" aria-label="Position"><span class="time">00:00.0</span></div></div>`;
/* ===== Study report ===== */
VIEWS.study=()=>{const m=S.study;if(!m)return VIEWS.studies();const st=m.stats||{n:0};const l=lineOf(m.lineId),o=opOf(l,m.opId);const ref=o?+o.smv||0:m.smvRef||0;const fd=findings({...st,hands:handNames()});
  const diff=ref&&st.n?(st.smv-ref)/ref:null;
  return`<div class="row"><button class="link" data-act="${l?"stLine":"go"}" data-v="studies">← ${l?esc(l.name):"All studies"}</button></div>
  <div class="sthead"><div class="eyebrow">${esc([m.opNo!==""&&m.opNo!=null?"Op "+m.opNo:"",l?l.name:m.lineName].filter(Boolean).join(" · ")||"Time study")}</div><h1>${esc(m.opName||"Study")}</h1>
   <p class="lead">${esc(m.operator||"Operator")}${m.empId?" ("+esc(m.empId)+")":""} · ${fmtDate(m.created)} · by ${esc(m.by||"")}${m.device?" on "+esc(m.device):""}</p></div>
  <div class="stats"><div class="stat"><b class="num">${st.n?st.ct.toFixed(1):"—"}</b><span>avg cycle time (s) · ${st.n} cycles</span></div>
   <div class="stat"><b class="num">${st.n?st.smv.toFixed(3):"—"}</b><span>SMV, rating ${m.rating}% + ${m.allow}% allowance${ref?` · bulletin ${ref.toFixed(3)}`:""}</span></div>
   <div class="stat${diff!=null&&diff>0.1?" bad":diff!=null&&diff<-0.1?" good":""}"><b class="num">${diff==null?"—":(diff>0?"+":"")+Math.round(diff*100)+"%"}</b><span>vs bulletin SMV</span></div>
   <div class="stat"><b class="num">${st.n?Math.round(st.perHour):"—"}</b><span>pieces / hour (standard)</span></div>

  ${fd.length?`<section class="panel"><h2>Improvement points</h2><div class="imp">${fd.map(f=>`<div class="imp-item" style="--c:${f.sev==="high"?"var(--miss)":f.sev==="mid"?"var(--slow)":f.sev==="low"?"var(--fast)":"var(--muted)"}"><span class="sev"></span><span class="t">${esc(f.title)}</span><span class="lost">${f.lost>0.05?"≈"+f.lost.toFixed(1)+" s":""}</span><span class="d">${esc(f.detail)}</span></div>`).join("")}</div>
   <p class="note">≈ s = estimated time that could be saved per cycle.</p></section>`:""}
  ${st.n?`<section class="panel"><h2>Hand motions per cycle</h2>${motionBars(st)}${motionTable(st)}</section>`:""}
  ${m.durs&&m.durs.length?`<section class="panel"><h2>Cycle times</h2>${cycleChart(m.durs,st.ct)}</section>`:""}
  <div class="row"><button class="btn sm primary" data-act="studyEdit">${ic("play")}Replay &amp; edit cycles</button><button class="btn sm" data-act="studyPdf">${ic("pdf")}Report PDF</button><button class="btn sm" data-act="studyXls">${ic("xls")}Excel</button>
   ${m.video&&NATIVE?`<button class="btn sm" data-act="stGallery">${m.video.gallery?"In Gallery ✓":"Copy video to Gallery"}</button>`:""}${m.video&&can("delete")?`<button class="btn sm" data-act="stDelVideo">Delete video</button>`:""}${can("delete")?`<button class="btn sm danger" data-act="stDel">${ic("trash")}Delete study</button>`:""}</div>
  ${!l&&S.lines.length&&can("edit")?`<section class="panel"><h2>Link to a line</h2><div class="row"><select id="stLnk" style="flex:1">${S.lines.map(x=>`<optgroup label="${esc(x.name)}">${(x.ops||[]).map(op=>`<option value="${esc(x.id)}|${esc(op.id)}">${esc(op.no??"")} ${esc(op.name)}</option>`).join("")}</optgroup>`).join("")}</select><button class="btn sm" data-act="stLink">Link</button></div></section>`:""}`};
function motionBars(st){const H=st.hands;return`<div class="mbars">${["a","b"].map(k=>{const m=st.mot[k];const tot=MORDER.split("").reduce((a,c)=>a+(m[c]||0),0)||1;
  return`<div class="mbar"><span class="ln">${H[k]}</span><div class="mb">${MORDER.split("").filter(c=>(m[c]||0)/tot>0.004).map(c=>`<i style="width:${(m[c]/tot*100).toFixed(2)}%;background:${MOT[c].c}" title="${MOT[c].l} ${m[c].toFixed(1)} s">${m[c]/tot>0.09?MOT[c].l.split(" ")[0]:""}</i>`).join("")}</div></div>`}).join("")}</div>`}
function motionTable(st){const H=st.hands;return`<div class="tbl-wrap"><table><thead><tr><th>Motion</th><th class="r">${H.a}</th><th class="r">${H.b}</th><th class="r">% of cycle</th></tr></thead><tbody>
  ${MORDER.split("").filter(c=>(st.mot.a[c]||0)+(st.mot.b[c]||0)>0.05).map(c=>`<tr><td><span class="st" style="--c:${MOT[c].c}">${MOT[c].l}</span></td><td class="r num">${(st.mot.a[c]||0).toFixed(2)} s</td><td class="r num">${(st.mot.b[c]||0).toFixed(2)} s</td><td class="r num">${pct(((st.mot.a[c]||0)+(st.mot.b[c]||0))/2/st.ct)}</td></tr>`).join("")}
  <tr><td><b>Cycle</b></td><td class="r num"><b>${st.ct.toFixed(2)} s</b></td><td class="r num"><b>${st.ct.toFixed(2)} s</b></td><td class="r num">100%</td></tr></tbody></table></div>
  <p class="note">Sewing / use is value added. Reach, grasp, move, position, release and hold are needed but add no value; idle is waiting.</p>`}
function cycleChart(durs,avg){const mx=Math.max(...durs)*1.1;return`<div class="cchart">${durs.map((d,i)=>`<div class="cc"><i style="height:${(d/mx*100).toFixed(1)}%" class="${d>avg*1.15?"hi":""}"></i><span class="num">${i+1}</span></div>`).join("")}<b class="avg" style="bottom:${(avg/mx*100).toFixed(1)}%"><span>avg ${avg.toFixed(1)} s</span></b></div>`}

  try{const j=JSON.parse(await f.text());const r=await mergePack(j);b.hidden=true;toast(r);await DB.load();render()}catch(e){b.hidden=true;toast("That file isn't a Line Study file ("+(e.message||e)+")")}};
async function mergePack(j){if(!j||(j.type!=="line-pack"&&j.type!=="linestudy-backup"))throw new Error("unknown type");
  const lines=j.type==="line-pack"?[j.line]:j.lines||[];const map={},opMap={};let nl=0,no=0,ns=0,nu=0;
  for(const L of lines){if(!L||!L.id)continue;let loc=lineOf(L.id)||S.lines.find(x=>x.name.trim().toLowerCase()===String(L.name||"").trim().toLowerCase()&&String(x.style||"").trim().toLowerCase()===String(L.style||"").trim().toLowerCase());
    if(!loc){loc=JSON.parse(JSON.stringify(L));await DB.putLine(loc);nl++;for(const o of loc.ops||[])opMap[L.id+"|"+o.id]=o.id}
    else{const ops=loc.ops||(loc.ops=[]);let ch=false;for(const o of L.ops||[]){let m=ops.find(x=>x.id===o.id)||ops.find(x=>String(x.no)===String(o.no)&&x.name.trim().toLowerCase()===o.name.trim().toLowerCase())||ops.find(x=>x.name.trim().toLowerCase()===o.name.trim().toLowerCase());
        if(!m){m={...o};ops.push(m);no++;ch=true}opMap[L.id+"|"+o.id]=m.id}if(ch||(L.updated||0)>(loc.updated||0)&&!["target"].every(k=>loc[k]===L[k])){if(!loc.target&&L.target)loc.target=L.target;await DB.putLine(loc)}}
    map[L.id]=loc.id}
  for(const p of j.studies||[]){const m=p&&p.meta;if(!m||!m.id)continue;const ex=S.studies.find(x=>x.id===m.id);if(ex&&(ex.updated||0)>=(m.updated||0))continue;
    const meta={...m};if(map[m.lineId]){meta.opId=opMap[m.lineId+"|"+m.opId]||meta.opId;meta.lineId=map[m.lineId]}if(ex&&ex.video)meta.video=ex.video;await DB.putStudy(meta,p.data);ns++}
  if(j.type==="linestudy-backup"&&Array.isArray(j.users)){for(const u of j.users)if(u&&u.uid&&u.hash&&!Users.find(u.uid)){Users.list.push(u);nu++}if(nu)await Users.save()}
  return[nl&&nl+" line"+(nl>1?"s":""),no&&no+" operation"+(no>1?"s":""),ns+" stud"+(ns===1?"y":"ies"),nu&&nu+" user"+(nu>1?"s":"")].filter(Boolean).join(", ")+" added"+(j.device?" from "+j.device:"")}

async function pdfFrom(pages,name,landscape){const b=$("#busy");b.textContent="Making PDF…";b.hidden=false;

    const pdf=new jspdf.jsPDF({orientation:landscape?"l":"p",unit:"pt",format:"a4"});const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    for(let i=0;i<pages.length;i++){host.innerHTML=`<div class="pdfpage" style="width:${W}px;height:${H}px">${pages[i]}<div class="pfoot">Line Study · ${esc(name)} · page ${i+1} of ${pages.length}</div></div>`;
      const cv=await html2canvas(host.firstChild,{scale:2,backgroundColor:"#ffffff",logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",0.9),"JPEG",0,0,pw,ph)}
    host.remove();const b64=pdf.output("datauristring").split(",")[1];b.hidden=true;await shareBinary(name+".pdf",b64,"application/pdf")}catch(e){b.hidden=true;toast("Couldn't make the PDF: "+(e.message||e))}}
ACT.studyPdf=()=>{const m=S.study,st=m.stats;const l=lineOf(m.lineId),o=opOf(l,m.opId);const ref=o?+o.smv||0:m.smvRef||0;const fd=findings({...st,hands:handNames()});
  const p=`<div class="ph1"><div><div class="pe">Time study · hand motion analysis</div><h1>${esc(m.opName||"Study")}</h1></div><div class="pmeta">${[["Line",l?l.name:m.lineName],["Operator",(m.operator||"")+(m.empId?" ("+m.empId+")":"")],["Date",fmtDate(m.created)],["Studied by",m.by],["Phone",m.device]].filter(x=>x[1]).map(x=>`<span><b>${esc(x[0])}</b> ${esc(x[1])}</span>`).join("")}</div></div>
   <div class="pstats">${[["Avg cycle",st.ct.toFixed(1)+" s"],["Cycles",st.n],["SMV",st.smv.toFixed(3)],["Bulletin SMV",ref?ref.toFixed(3):"—"],["Pieces / hour",Math.round(st.perHour)],["Value added",pct(st.vaPct)],["Variation (CV)",pct(st.cv)],["Rating / allowance",m.rating+"% / "+m.allow+"%"]].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
   <h2>Hand motions per cycle</h2>${motionBars(st)}${motionTable(st)}
   ${fd.length?`<h2>Improvement points</h2><ol class="pfind">${fd.map(f=>`<li><b>${esc(f.title)}</b>${f.lost>0.05?` <i>≈ ${f.lost.toFixed(1)} s per cycle</i>`:""}<br>${esc(f.detail)}</li>`).join("")}</ol>`:""}
   ${m.durs&&m.durs.length?`<h2>Cycle times</h2>${cycleChart(m.durs,st.ct)}`:""}`;
  pdfFrom([p],"Study-"+safeName(m.opName)+"-"+safeName(m.operator||""),false)};
ACT.linePdf=()=>{const l=S.line,c=lineCalc(l,studiesOf(l.id));
  const head=`<div class="ph1"><div><div class="pe">Line balance report</div><h1>${esc(l.name)}</h1></div><div class="pmeta">${[["Unit",l.unit],["Buyer",l.buyer],["Style",l.style],["Order",l.order],["Date",fmtDate(Date.now())]].filter(x=>x[1]).map(x=>`<span><b>${x[0]}</b> ${esc(x[1])}</span>`).join("")}</div></div>
   <div class="pstats">${[["Target / hour",c.target||"—"],["Takt time",c.takt?c.takt.toFixed(1)+" s":"—"],["Output / hour",c.out?Math.round(c.out):"—"],["Balance ratio",c.lbr?pct(c.lbr):"—"],["Efficiency",c.eff?pct(c.eff):"—"],["Operators",c.mp],["Total SMV",c.totSmv.toFixed(2)],["Studied",c.measured+" / "+(l.ops||[]).length]].map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>`;
  const tbl=rows=>`<table class="ptbl"><thead><tr><th>No</th><th>Operation</th><th>Machine</th><th>MP</th><th>SMV</th><th>Actual</th><th>Diff</th><th>Station s</th><th>Pcs/h</th><th>Need MP</th></tr></thead><tbody>${rows.map(x=>`<tr${x===c.bn?' class="bn"':""}><td>${esc(x.op.no??"")}</td><td>${esc(x.op.name)}</td><td>${esc(x.op.machine||"")}</td><td>${x.n}</td><td>${(+x.op.smv||0).toFixed(3)}</td><td>${x.act?(x.act/60).toFixed(3):"—"}</td><td>${x.diff==null?"":(x.diff>0?"+":"")+Math.round(x.diff*100)+"%"}</td><td>${x.ct?x.ct.toFixed(1):""}</td><td>${x.perHour?Math.round(x.perHour):""}</td><td>${x.need?x.need.toFixed(2):""}</td></tr>`).join("")}</tbody></table>`;
  const pages=[head+`<h2>Line balance</h2>${balanceChart(c).replace('class="bal"','class="bal pbal"')}${c.bn?`<h2>What to do</h2><ul class="pfind">${balanceTips(c).map(t=>`<li>${t}</li>`).join("")}</ul>`:""}`];
  const R=c.ops;for(let i=0;i<R.length;i+=26)pages.push(`<h2>Operations${i?" (continued)":""}</h2>`+tbl(R.slice(i,i+26)));
  pdfFrom(pages,"LineBalance-"+safeName(l.name),false)};
async function xlsOut(wb,name){const buf=await wb.xlsx.writeBuffer();await shareBinary(name+".xlsx",abToB64(buf),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}
function xlsHead(ws,cols){ws.addRow(cols);const r=ws.lastRow;r.font={bold:true,color:{argb:"FFFFFFFF"}};r.eachCell(c=>{c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF0D7A71"}}})}
function studyRows(ws,list){xlsHead(ws,["Date","Line","Op no","Operation","Operator","ID","Cycles","Avg cycle s","Min s","Max s","CV %","Rating %","Allowance %","Standard s","SMV","Bulletin SMV","Diff %","Pcs/hour","Value added %","Phone","By"]);
  for(const m of list){const s=m.stats||{};const l=lineOf(m.lineId),o=opOf(l,m.opId);const ref=o?+o.smv||0:m.smvRef||0;
    ws.addRow([new Date(m.created),l?l.name:m.lineName||"",m.opNo??"",m.opName,m.operator,m.empId,s.n,+(s.ct||0).toFixed(2),+(s.min||0).toFixed(2),+(s.max||0).toFixed(2),Math.round((s.cv||0)*100),m.rating,m.allow,+(s.std||0).toFixed(2),+(s.smv||0).toFixed(4),ref||"",ref&&s.n?Math.round((s.smv-ref)/ref*100):"",Math.round(s.perHour||0),Math.round((s.vaPct||0)*100),m.device,m.by])}
  ws.getColumn(1).numFmt="yyyy-mm-dd hh:mm";ws.columns.forEach(c=>c.width=13);ws.getColumn(4).width=28}
function motionRows(ws,list){xlsHead(ws,["Operation","Operator","Hand",...MORDER.split("").map(c=>MOT[c].l+" s")]);
  for(const m of list){const s=m.stats;if(!s||!s.n)continue;const H=handNames();for(const k of["a","b"])ws.addRow([m.opName,m.operator,H[k],...MORDER.split("").map(c=>+(s.mot[k][c]||0).toFixed(2))])}ws.columns.forEach(c=>c.width=14);ws.getColumn(1).width=28}
ACT.studyXls=async()=>{const m=S.study;try{await loadLib("exceljs");const wb=new ExcelJS.Workbook();studyRows(wb.addWorksheet("Summary"),[m]);motionRows(wb.addWorksheet("Hand motions"),[m]);
  const ws=wb.addWorksheet("Cycles");xlsHead(ws,["Cycle","Start s","Time s"]);(m.cycles||[]).forEach((c,i)=>ws.addRow([i+1,+(c.s/1000).toFixed(2),+((c.e-c.s)/1000).toFixed(2)]));
  const fw=wb.addWorksheet("Improvements");xlsHead(fw,["Point","Detail","Saving s per cycle"]);findings({...m.stats,hands:handNames()}).forEach(f=>fw.addRow([f.title,f.detail,+f.lost.toFixed(1)]));fw.getColumn(1).width=50;fw.getColumn(2).width=90;
  await xlsOut(wb,"Study-"+safeName(m.opName)+"-"+safeName(m.operator||""))}catch(e){toast("Couldn't make the Excel file: "+(e.message||e))}};
ACT.lineXls=async()=>{const l=S.line,ss=studiesOf(l.id),c=lineCalc(l,ss);try{await loadLib("exceljs");const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet("Line balance");
  ws.addRow(["Line",l.name,"Unit",l.unit||"","Buyer",l.buyer||"","Style",l.style||""]);ws.addRow(["Target / hour",c.target||"","Takt s",c.takt?+c.takt.toFixed(2):"","Output / hour",c.out?Math.round(c.out):"","Balance ratio %",Math.round(c.lbr*100),"Efficiency %",Math.round(c.eff*100)]);ws.addRow([]);
  xlsHead(ws,["No","Operation","Machine","Manpower","Bulletin SMV","Actual SMV","Diff %","Station cycle s","Pcs / hour","Operators needed","Studies","Bottleneck"]);
  for(const x of c.ops)ws.addRow([x.op.no??"",x.op.name,x.op.machine||"",x.n,+x.op.smv||0,x.act?+(x.act/60).toFixed(4):"",x.diff==null?"":Math.round(x.diff*100),x.ct?+x.ct.toFixed(2):"",x.perHour?Math.round(x.perHour):"",x.need?+x.need.toFixed(2):"",x.studies.length,x===c.bn?"YES":""]);
  ws.columns.forEach(cl=>cl.width=13);ws.getColumn(2).width=32;studyRows(wb.addWorksheet("Studies"),ss);motionRows(wb.addWorksheet("Hand motions"),ss);
  await xlsOut(wb,"LineBalance-"+safeName(l.name))}catch(e){toast("Couldn't make the Excel file: "+(e.message||e))}};

  study:"studies",lines:"home",studies:"home",settings:"home",users:"home",password:"home",request:"login"}[v]||null}
function onBack(){if(!$("#modal").hidden){closeModal();return}if(!$("#menu").hidden){closeMenu();return}
  if(S.view==="request"){go("login");return}if(!S.user||S.view==="home"||S.view==="login"){ACT.exitAsk();return}
  if(S.view==="review"&&!A.edit&&!confirm("Leave without saving this study?"))return;
  const t=backTarget();if(t==="study"&&!S.study)go("studies");else if(t)go(t);else go("home")}
